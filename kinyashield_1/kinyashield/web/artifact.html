/* Layout: one calm column. Header (logo + language), tabs, then the checker with result below.
   System fonts only: fast on weak connections and no outside requests. */
:root{

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1718; --surface:#122324; --surface-2:#1a3032; --ink:#e7f2f0; --ink-2:#a3bab7; --line:#284241;
  --brand:#46c49a; --brand-2:#63bde6; --on-brand:#06201a; --focus:#63bde6;
  --ok:#62d49d; --ok-bg:#12301f; --warn:#f2b653; --warn-bg:#33270c; --bad:#ff948b; --bad-bg:#3b1815;
  --mark-high:rgba(255,120,110,.34); --mark-med:rgba(240,170,50,.38); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1718; --surface:#122324; --surface-2:#1a3032; --ink:#e7f2f0; --ink-2:#a3bab7; --line:#284241;
  --brand:#46c49a; --brand-2:#63bde6; --on-brand:#06201a; --focus:#63bde6;
  --ok:#62d49d; --ok-bg:#12301f; --warn:#f2b653; --warn-bg:#33270c; --bad:#ff948b; --bad-bg:#3b1815;
  --mark-high:rgba(255,120,110,.34); --mark-med:rgba(240,170,50,.38); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;font-size:1rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-size:1.45rem;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:.92rem;max-width:34ch;text-wrap:balance}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;min-height:40px;font-weight:600;font-size:.92rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--ink-2);margin-bottom:-2px;border-bottom:3px solid transparent;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.panel[hidden]{display:none}
.note{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--ink-2)}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:9.5rem;resize:vertical;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{max-width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:42px}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer;min-height:46px}
.btn.primary{background:var(--brand);color:var(--on-brand);flex:1 1 12rem}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.small{font-size:.88rem;color:var(--ink-2)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
#result{display:flex;flex-direction:column;gap:14px}
.verdict{display:flex;gap:14px;align-items:center;border:2px solid;border-radius:14px;padding:16px 18px}
.verdict svg{flex:none}
.verdict h2{margin:0;font-size:1.3rem;line-height:1.2;text-wrap:balance}
.verdict p{margin:4px 0 0;font-size:.9rem;color:var(--ink-2)}
.verdict.ok{border-color:var(--ok);background:var(--ok-bg)} .verdict.ok svg{color:var(--ok)}
.verdict.verify{border-color:var(--warn);background:var(--warn-bg)} .verdict.verify svg{color:var(--warn)}

h3{margin:0 0 8px;font-size:1.02rem}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);line-height:1.75}
mark{color:inherit;border-radius:4px;padding:1px 2px}
mark.high{background:var(--mark-high);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
mark.medium{background:var(--mark-med);text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:3px}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h4{margin:6px 0 4px;font-size:1rem}
.card p{margin:4px 0;font-size:.94rem}
.sev{font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.sev.high{background:var(--bad-bg);color:var(--bad)} .sev.medium{background:var(--warn-bg);color:var(--warn)} .sev.low{background:var(--surface-2);color:var(--ink-2)}
code{font-family:var(--mono);font-size:.85rem;background:var(--surface-2);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
ol.steps{margin:0;padding-left:1.3rem;display:grid;gap:8px}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .chip[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.sources li,.about li,.tips li{margin:6px 0}
ul.plain{padding-left:1.2rem;margin:8px 0}
.scamlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr))}
textarea.exp{min-height:6rem;font-family:var(--mono);font-size:.82rem}
@media (max-width:520px){.verdict{flex-direction:column;align-items:flex-start}.tools{width:100%}.seg{width:100%}.seg button{flex:1;padding-inline:6px}}
@media (prefers-reduced-motion:no-preference){.verdict,.card{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

/* ---- Ask tab: chat layout ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#p-ask{display:flex;flex-direction:column;gap:12px}
.askhead{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start}
.askhead h2{margin:0;font-size:1.25rem;letter-spacing:-.01em}
.askhead p{margin:4px 0 0;max-width:52ch}
.chat{display:flex;flex-direction:column;gap:12px}
.msgrow{display:flex;flex-direction:column;gap:4px;max-width:100%}
.msgrow.me{align-items:flex-end}
.who{font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding-inline:6px}
.bub{border-radius:16px;padding:12px 16px;min-width:0;max-width:min(100%,40rem);overflow-wrap:anywhere;line-height:1.6}
.bub.me{background:var(--brand);color:var(--on-brand);border-bottom-right-radius:5px;white-space:pre-wrap}
.bub.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bub.ai{white-space:pre-wrap;border-left:4px solid var(--brand-2)}
.bub h4{margin:0 0 6px;font-size:1.05rem}
.bub h5{margin:12px 0 6px;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.bub p{margin:6px 0}
.bub .srcline{font-size:.8rem;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
.bub .btn{margin-top:8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.sugg .chip{text-align:left;max-width:100%;border-radius:999px;padding:8px 14px;min-height:40px;line-height:1.3}
.sugg .chip:hover{border-color:var(--brand)}
#p-ask>.sugg{margin-top:0}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:6px}
.composer textarea{min-height:3rem;max-height:10rem;border-radius:24px;padding:12px 18px;flex:1;resize:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.composer .btn{flex:0 0 auto;min-width:5.5rem;border-radius:24px}
.composer .btn.primary{flex:0 0 auto}
.composer .btn[hidden]{display:none}
.chat:empty{display:none}
.top{padding-bottom:4px}
.tabs button{font-size:.98rem}
@media (max-width:520px){.composer .btn{min-width:4.5rem;padding-inline:14px}.bub{max-width:100%}}

/* ---- Two-part layout: Cybersecurity | Ask anything ---- */
.tabs{overflow-x:auto;scrollbar-width:thin}
.tabs button{white-space:nowrap}
.subseg{align-self:flex-start;margin-bottom:12px}
.subpanel[hidden]{display:none}

#p-cyber,#p-gen{display:flex;flex-direction:column;gap:12px}
#p-gen[hidden],#p-cyber[hidden]{display:none}
.brand p{max-width:60ch}

"},"why":{"en":"Most messages with links are harmless; links matter when other warning signs are present.","fr":"La plupart des messages avec liens sont inoffensifs; les liens comptent s'il y a d'autres signes.","rw":"Ubutumwa bwinshi bufite amahuza ntibubi; amahuza agira uburemere iyo hari ibindi bimenyetso.","sw":"Jumbe nyingi zenye viungo hazina madhara; viungo ni muhimu pale kuna dalili nyingine."},"advice":{"en":"Prefer typing official addresses yourself.","fr":"Préférez taper vous-même les adresses officielles.","rw":"Ahubwo wandike ubwawe aderesi zemewe.","sw":"Afadhali andika mwenyewe anwani rasmi."},"patterns":{"any":["https?://\\S+"]}}],"protective":{"en":["\\b(?:never|do not|don't|dont|should not|shouldn't|must not|mustn't|won't|will not|not to)\\s+(?:ever\\s+)?$","\\b(?:never|no\\s+\\w+|nobody|not|n't|don't|won't)\\b[^,;]*\\b(?:ask|asks|asking|request|requests|require|requires|tell)\\w*\\b[^,;]*$"],"fr":["\\bn(?:e|')\\s*$","\\bjamais\\s+$","\\b(?:aucun\\w*|personne|jamais|pas)\\b[^,;]*\\b(?:demand|exig|solicit)\\w*\\b[^,;]*$"],"rw":["\\b(?:ntugasangize|ntugatange|ntukohereze|ntukamuhe|ntukabwire|ntuzigere|ntituzigera|ntituzigere)\\b[^,;]*$"],"sw":["\\b(?:kamwe|hatutakuomba|hatutaomba|hatuombi|haitakuuliza|hawatakuuliza|hatutakuuliza|hakuna\\s+\\w+\\s+itakayokuomba)\\b[^,;]*$"]},"general":{"en":["Do not click links or call numbers from a message you did not expect.","Never share a PIN, password or one-time code with anyone.","Contact the organisation using details from its official website, card or branch.","Talk to someone you trust before sending money."],"fr":["Ne cliquez pas sur les liens et n'appelez pas les numéros d'un message inattendu.","Ne partagez jamais un code PIN, un mot de passe ou un code à usage unique.","Contactez l'organisme avec les coordonnées de son site officiel, de votre carte ou de son agence.","Parlez à quelqu'un de confiance avant d'envoyer de l'argent."],"rw":["Ntukande amahuza cyangwa ngo uhamagare nimero ziri mu butumwa utari the organisation yourself, using its official website, your card or a branch.","Talk to someone you trust before you send money, especially when you are told to hurry or keep it secret."],"about_title":"About KinyaShield RW","about":["Regis KinyaShield RW is a cybersecurity and AI project focused on digital safety, threat awareness and intelligent protection against online risks. It has a cybersecurity part (check messages, learn, safety guide) and an AI part where you can ask anything and get an answer in English, French, Kinyarwanda or Kiswahili.","KinyaShield explains why a message may be suspicious, in English, French, Kinyarwanda and Kiswahili.","It uses written rules you can read, not a hidden model. Every warning shows the exact words that caused it.","It is a decision aid. It cannot prove a message is safe, and it can miss new tricks, especially messages that sound normal.","Rules and wording in French, Kinyarwanda and Kiswahili are drafts until fluent speakers have reviewed them.","Tested only on short fictional messages written by the project owner. Real-world accuracy is not yet known."],"sources_title":"Where to get official help","sources_note":"Look up contact details yourself on the official website. This app does not list phone numbers on purpose.","sev_high":"High","sev_medium":"Medium","sev_low":"Minor","theme_auto":"Auto","theme_light":"Light","theme_dark":"Dark","example_note":"Fictional example message","result_head":"KinyaShield result","scam_types_title":"Common scam types","works_offline":"Once this page has loaded it keeps working without internet.","reasons":"Reasons","version":"Version","rules_count":"rules","no_reasons":"No warning signs matched","fb_clear":"Clear saved reports","fb_shown":"Report saved","lang_guess_unknown":"unclear","tab_ask":"Ask","ask_title":"Ask a safety question","ask_welcome":"Ask about scams, mobile-money safety, passwords, lost phones and more. Answers come from a guide written by the KinyaShield team.","ask_plac te contre les risques en ligne. Répond aussi à toute question que vous posez.","tab_check":"Vérifier","tab_learn":"Apprendre","tab_about":"À propos","paste":"Collez le message reçu","placeholder":"Collez ici le message suspect","analyze":"Vérifier le message","clear":"Effacer","examples":"Essayer un exemple","language":"Langue","detected":"La langue du message semble être","evidence":"Mots qui ont déclenché l'alerte","findings":"Pourquoi il est signalé","steps":"Prochaines étapes les plus sûres","protective":"Formulation protectrice (lue comme un avertissement, non comptée)","low":"Signes mineurs (comptent seulement avec d'autres)","none_found":"Aucune règle ne correspond. Cela ne prouve pas que le message est sûr.","paste_first":"Collez d'abord un message.","privacy":"Votre message est analysé dans cette page. Il n'est ni envoyé ni conservé.","draft_note":"Une partie de cette traduction est un brouillon en attente de relecture par des locuteurs.","copy_summary":"Copier le résumé","copied":"Copié","copy_failed":"Sélectionnez le texte et copiez-le manuellement.","feedback_q":"Ce résultat était-il juste ?","fb_right":"Oui, juste","fb_missed":"Il a raté une arnaque","fb_false":"Fausse alerte","fb_thanks":"Enregistré sur cet appareil uniquement. Merci.","fb_export":"Copier mes retours en CSV","fb_count":"signalements enregistrés","fb_include":"Inclure le texte du message dans l'export","fb_help":"Les signalements aident à améliorer les règles. Rien n'est envoyé sauf si vous le copiez et le partagez vous-même.","text_size":"Taille du texte","theme":"Thème","learn_title":"Cinq réflexes qui évitent la plupart des arnaques","tips":["Ne cliquez pas sur les liens et n'appelez pas les numéros d'un message inattendu.","Ne partagez jamais un code PIN, un mot de passe ou un code à usage unique, même avec quelqu'un qui dit travailler pour votre banque.","On ne paie jamais de frais pour recevoir un gain, un prêt ou une bourse.","Vérifiez vous-même auprès de l'organisme, via son site officiel, votre carte ou une agence.","Parlez à quelqu'un de confiance avant d'envoyer de l'argent, surtout si on vous presse ou vous demande le secret."],"about_title":"À propos de KinyaShield RW","about":["Regis KinyaShield RW est un projet de cybersécurité et d'IA axé sur la sécurité numérique, la sensibilisation aux menaces et la protection intelligente contre les risques en ligne. Il comprend une partie cybersécurité (vérifier des messages, apprendre, guide de sécurité) et une partie IA où vous pouvez poser n'importe quelle question et obtenir une réponse en anglais, français, kinyarwanda ou kiswahili.","KinyaShield explique pourquoi un message peut être suspect, en anglais, français, kinyarwanda et kiswahili.","Il utilise des règles écrites que vous pouvez lire, pas un modèle caché. Chaque alerte montre les mots exacts qui l'ont causée.","C'est une aide à la décision. Il ne peut pas prouver qu'un message est sûr et peut rater de nouvelles ruses, surtout les messages qui paraissent normaux.","Les règles et formulations en français, kinyarwanda et kiswahili sont des brouillons tant que des locuteurs ne les ont pas relues.","Testé uniquement sur de courts messages fictifs écrits par le porteur du projet. La précision en conditions réelles est inconnue."],"sources_title":"Où trouver de l'aide officielle","sources_note":"Cherchez vous-même les coordonnées sur le site officiel. Cette appli n'affiche volontairement aucun numéro de téléphone.","sev_high":"Élevé","sev_medium":"Moyen","sev_low":"Mineur","theme_auto":"Auto","theme_light":"Clair","theme_dark":"Sombre","example_note":"Exemple de message fictif","result_head":"Résultat KinyaShield","scam_types_title":"Types d'arnaques courants","works_offline":"Une fois la page chargée, elle continue de fonctionner sans internet.","reasons":"Raisons","version":"Version","rules_count":"règles","no_reasons":"Aucun signe d'alerte trouvé","fb_clear":"Effacer les signalements","fb_shown":"Signalement enregistré","lang_guess_un
