<style>
/* Layout: one calm column. Header (logo + language), tabs, then the checker with result below.
   System fonts only: fast on weak connections and no outside requests. */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --surface-2:#e7efed; --ink:#11292b; --ink-2:#465c5e; --line:#c9d8d5;
  --brand:#0b6e4f; --brand-2:#1479a8; --on-brand:#ffffff; --focus:#1479a8;
  --ok:#17794f; --ok-bg:#e2f3ea; --warn:#8f5200; --warn-bg:#fbefd5; --bad:#b3261e; --bad-bg:#fbe3e0;
  --mark-high:rgba(179,38,30,.26); --mark-med:rgba(224,150,20,.40);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1718; --surface:#122324; --surface-2:#1a3032; --ink:#e7f2f0; --ink-2:#a3bab7; --line:#284241;
  --brand:#46c49a; --brand-2:#63bde6; --on-brand:#06201a; --focus:#63bde6;
  --ok:#62d49d; --ok-bg:#12301f; --warn:#f2b653; --warn-bg:#33270c; --bad:#ff948b; --bad-bg:#3b1815;
  --mark-high:rgba(255,120,110,.34); --mark-med:rgba(240,170,50,.38); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1718; --surface:#122324; --surface-2:#1a3032; --ink:#e7f2f0; --ink-2:#a3bab7; --line:#284241;
  --brand:#46c49a; --brand-2:#63bde6; --on-brand:#06201a; --focus:#63bde6;
  --ok:#62d49d; --ok-bg:#12301f; --warn:#f2b653; --warn-bg:#33270c; --bad:#ff948b; --bad-bg:#3b1815;
  --mark-high:rgba(255,120,110,.34); --mark-med:rgba(240,170,50,.38); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;font-size:1rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-size:1.45rem;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:.92rem;max-width:34ch;text-wrap:balance}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;min-height:40px;font-weight:600;font-size:.92rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--ink-2);margin-bottom:-2px;border-bottom:3px solid transparent;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.panel[hidden]{display:none}
.note{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--ink-2)}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:9.5rem;resize:vertical;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{max-width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:42px}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer;min-height:46px}
.btn.primary{background:var(--brand);color:var(--on-brand);flex:1 1 12rem}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.small{font-size:.88rem;color:var(--ink-2)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
#result{display:flex;flex-direction:column;gap:14px}
.verdict{display:flex;gap:14px;align-items:center;border:2px solid;border-radius:14px;padding:16px 18px}
.verdict svg{flex:none}
.verdict h2{margin:0;font-size:1.3rem;line-height:1.2;text-wrap:balance}
.verdict p{margin:4px 0 0;font-size:.9rem;color:var(--ink-2)}
.verdict.ok{border-color:var(--ok);background:var(--ok-bg)} .verdict.ok svg{color:var(--ok)}
.verdict.verify{border-color:var(--warn);background:var(--warn-bg)} .verdict.verify svg{color:var(--warn)}
.verdict.high{border-color:var(--bad);background:var(--bad-bg)} .verdict.high svg{color:var(--bad)}
h3{margin:0 0 8px;font-size:1.02rem}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);line-height:1.75}
mark{color:inherit;border-radius:4px;padding:1px 2px}
mark.high{background:var(--mark-high);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
mark.medium{background:var(--mark-med);text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:3px}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h4{margin:6px 0 4px;font-size:1rem}
.card p{margin:4px 0;font-size:.94rem}
.sev{font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.sev.high{background:var(--bad-bg);color:var(--bad)} .sev.medium{background:var(--warn-bg);color:var(--warn)} .sev.low{background:var(--surface-2);color:var(--ink-2)}
code{font-family:var(--mono);font-size:.85rem;background:var(--surface-2);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
ol.steps{margin:0;padding-left:1.3rem;display:grid;gap:8px}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .chip[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.sources li,.about li,.tips li{margin:6px 0}
ul.plain{padding-left:1.2rem;margin:8px 0}
.scamlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr))}
textarea.exp{min-height:6rem;font-family:var(--mono);font-size:.82rem}
@media (max-width:520px){.verdict{flex-direction:column;align-items:flex-start}.tools{width:100%}.seg{width:100%}.seg button{flex:1;padding-inline:6px}}
@media (prefers-reduced-motion:no-preference){.verdict,.card{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

</style>

"},"why":{"en":"Most messages with links are harmless; links matter when other warning signs are present.","fr":"La plupart des messages avec liens sont inoffensifs; les liens comptent s'il y a d'autres signes.","rw":"Ubutumwa bwinshi bufite amahuza ntibubi; amahuza agira uburemere iyo hari ibindi bimenyetso.","sw":"Jumbe nyingi zenye viungo hazina madhara; viungo ni muhimu pale kuna dalili nyingine."},"advice":{"en":"Prefer typing official addresses yourself.","fr":"Préférez taper vous-même les adresses officielles.","rw":"Ahubwo wandike ubwawe aderesi zemewe.","sw":"Afadhali andika mwenyewe anwani rasmi."},"patterns":{"any":["https?://\\S+"]}}],"protective":{"en":["\\b(?:never|do not|don't|dont|should not|shouldn't|must not|mustn't|won't|will not|not to)\\s+(?:ever\\s+)?$","\\b(?:never|no\\s+\\w+|nobody|not|n't|don't|won't)\\b[^,;]*\\b(?:ask|asks|asking|request|requests|require|requires|tell)\\w*\\b[^,;]*$"],"fr":["\\bn(?:e|')\\s*$","\\bjamais\\s+$","\\b(?:aucun\\w*|personne|jamais|pas)\\b[^,;]*\\b(?:demand|exig|solicit)\\w*\\b[^,;]*$"],"rw":["\\b(?:ntugasangize|ntugatange|ntukohereze|ntukamuhe|ntukabwire|ntuzigere|ntituzigera|ntituzigere)\\b[^,;]*$"],"sw":["\\b(?:kamwe|hatutakuomba|hatutaomba|hatuombi|haitakuuliza|hawatakuuliza|hatutakuuliza|hakuna\\s+\\w+\\s+itakayokuomba)\\b[^,;]*$"]},"general":{"en":["Do not click links or call numbers from a message you did not expect.","Never share a PIN, password or one-time code with anyone.","Contact the organisation using details from its official website, card or branch.","Talk to someone you trust before sending money."],"fr":["Ne cliquez pas sur les liens et n'appelez pas les numéros d'un message inattendu.","Ne partagez jamais un code PIN, un mot de passe ou un code à usage unique.","Contactez l'organisme avec les coordonnées de son site officiel, de votre carte ou de son agence.","Parlez à quelqu'un de confiance avant d'envoyer de l'argent."],"rw":["Ntukande amahuza cyangwa ngo uhamagare nimero ziri mu butumwa utari (function (root) {
  "use strict";
  var FLAGS = "gi";

  function fold(text) {
    text = text || "";
    var out = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === "’" || ch === "‘") { out += "'"; continue; }
      if (ch === " " || ch === " ") { out += " "; continue; }
      if (ch.charCodeAt(0) < 128) { out += ch; continue; }
      var d = ch.normalize("NFD").replace(/[̀-ͯ]/g, "");
      out += d.length === 1 ? d : ch;
    }
    return out;
  }

  function detectLanguage(D, folded) {
    var t = " " + folded.toLowerCase().replace(/[^a-z0-9' ]+/g, " ") + " ";
    var best = "en", bestN = 1;
    D.langs.forEach(function (lang) {
      var n = 0;
      D.markers[lang].forEach(function (m) { if (t.indexOf(" " + m + " ") !== -1) n++; });

    while ((m = re.exec(head)) !== null) last = m.index + m[0].length;
    return text.slice(last, start);
  }

  function sentence(text, start, end) {
    var first = 0, re = /[.!?\n]\s/g, m, head = text.slice(0, start);
    while ((m = re.exec(head)) !== null) first = m.index + m[0].length;
    var tail = text.slice(end), nx = /[.!?\n]\s/.exec(tail);
    return nx ? text.slice(first, end + nx.index + 1) : text.slice(first);
  }

  function anyMatch(patterns, s) {
    for (var i = 0; i < patterns.length; i++) if (new RegExp(patterns[i], "i").test(s)) return true;
    return false;
  }

            });

          found.push(hit);
        }

      } else {
        Object.keys(rule.patterns).forEach(function (l) {
          rule.patterns[l].forEach(function (pat) {
            var re = new RegExp(pat, FLAGS), m;

        spans.forEach(function (sp) { var k = sp[0] + ":" + sp[1] + ":" + sp[2]; if (!seen[k]) { seen[k] = 1; uniq.push(sp); } });
        uniq.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });

      }

  function renderLearn() {
    var p = clear($("p-learn")), box = el("div"); box.style.cssText = "display:flex;flex-direction:column;gap:14px";
    box.appendChild(el("h3", "", t("learn_title")));
    var ol = el("ol", "steps"); t("tips").forEach(function (x) { ol.appendChild(el("li", "", x)); }); box.appendChild(ol);
    box.appendChild(el("h3", "", t("scam_types_title")));
    var grid = el("div", "scamlist");
    D.rules.forEach(function (r) {
      if (r.severity === "low") return;
      var c = el("div", "card"); c.appendChild(el("span", "sev " + r.severity, t("sev_" + r.severity)));
      c.appendChild(el("h4", "", r.title[state.lang])); c.appendChild(el("p", "", r.why[state.lang]));
      var a = el("p", "small"); a.textContent = r.advice[state.lang]; c.appendChild(a); grid.appendChild(c);
    });
    box.appendChild(grid); p.appendChild(box);
  }

  function renderAbout() {
    var p = clear($("p-about")), box = el("div"); box.style.cssText = "display:flex;flex-direction:column;gap:12px";
    box.appendChild(el("h3", "", t("about_title")));
    var ul = el("ul", "about plain"); t("about").forEach(function (x) { ul.appendChild(el("li", "", x)); }); box.appendChild(ul);
    box.appendChild(el("p", "small", t("works_offline")));
    box.appendChild(el("h3", "", t("sources_title")));
    var s = el("ul", "sources plain");
    D.sources.forEach(function (src) {
      var li = el("li"); li.appendChild(el("strong", "", src.name)); li.appendChild(document.createTextNode(": " + (src.use[state.lang] || src.use.en)));
      if (src.url) { li.appendChild(document.createTextNode(" ")); var c = el("code", "", src.url); li.appendChild(c); }
      s.appendChild(li);
    });
    box.appendChild(s); box.appendChild(el("p", "small", t("sources_note")));
    box.appendChild(el("p", "small", t("version") + " " + D.version + " · " + D.rules.length + " " + t("rules_count") + " · " + D.langs.join(" / ")));
    p.appendChild(box);
  }

  /* ---------- result ---------- */
  function renderResult(res) {
    var out = clear($("result"));
    if (!res) return;
    var v = el("div", "verdict " + res.verdict);
    var ic = el("div"); ic.innerHTML = ICONS[res.verdict]; v.appendChild(ic);
    var vt = el("div"); vt.appendChild(el("h2", "", D.verdicts[res.verdict][state.lang])); vt.appendChild(el("p", "", D.noGuarantee[state.lang])); v.appendChild(vt);
    out.appendChild(v);
    out.appendChild(el("p", "small", t("detected") + ": " + D.langNames[res.language]));

    var sec = el("div"); sec.appendChild(el("h3", "", t("evidence")));
    var m = el("div", "msg"), pos = 0;
    K.highlightSpans(res).forEach(function (sp) {
      if (sp[0] > pos) m.appendChild(document.createTextNode(res.text.slice(pos, sp[0])));
      m.appendChild(el("mark", sp[2], res.text.slice(sp[0], sp[1]))); pos = sp[1];
    });
    if (pos < res.text.length) m.appendChild(document.createTextNode(res.text.slice(pos)));
    sec.appendChild(m); out.appendChild(sec);

    var main = res.findings.filter(function (f) { return f.severity !== "low"; });
    var low = res.findings.filter(function (f) { return f.severity === "low"; });
    var fsec = el("div"); fsec.appendChild(el("h3", "", t("findings")));
    var cards = el("div", "cards");
    if (!main.length) cards.appendChild(el("div", "card", t("none_found")));
    main.forEach(function (f) { cards.appendChild(card(f, true)); });
    fsec.appendChild(cards); out.appendChild(fsec);
    if (low.length) {
      var lsec = el("div"); lsec.appendChild(el("h3", "", t("low")));
      var lc = el("div", "cards"); low.forEach(function (f) { lc.appendChild(card(f, false)); }); lsec.appendChild(lc); out.appendChild(lsec);
    }
    if (res.protective.length) {
      var psec = el("div"); psec.appendChild(el("h3", "", t("protective")));
      var pc = el("div", "card"); res.protective.forEach(function (sp) { pc.appendChild(el("code", "", sp[2])); pc.appendChild(document.createTextNode(" ")); });
      psec.appendChild(pc); out.appendChild(psec);
    }
    var ssec = el("div"); ssec.appendChild(el("h3", "", t("steps")));
    var ol = el("ol", "steps"); K.nextSteps(D, res, state.lang).forEach(function (s) { ol.appendChild(el("li", "", s)); });
    ssec.appendChild(ol); out.appendChild(ssec);

    var act = el("div", "row"), cp = el("button", "btn ghost", t("copy_summary")); cp.type = "button";
    cp.addEventListener("click", function () { copyText(summary(res), cp, t("copy_summary")); });
    act.appendChild(cp); out.appendChild(act);
    out.appendChild(feedbackBox(res));
  }

  function card(f, withEvidence) {
    var c = el("div", "card"); c.appendChild(el("span", "sev " + f.severity, t("sev_" + f.severity)));
    c.appendChild(el("h4", "", f.title[state.lang])); c.appendChild(el("p", "", f.why[state.lang]));
    if (withEvidence) { var p = el("p"); f.evidence.slice(0, 3).forEach(function (e) { p.appendChild(el("code", "", e[2])); p.appendChild(document.createTextNode(" ")); }); c.appendChild(p); }
    return c;
  }

  function summary(res) {
    var lines = ["KinyaShield RW: " + D.verdicts[res.verdict][state.lang], ""];
    var main = res.findings.filter(function (f) { return f.severity !== "low"; });
    lines.push(t("reasons") + ":");
    if (!main.length) lines.push("- " + t("no_reasons"));
    main.forEach(function (f) { lines.push("- " + f.title[state.lang]); });
    lines.push("", t("steps") + ":");
    K.nextSteps(D, res, state.lang).forEach(function (s, i) { lines.push((i + 1) + ". " + s); });
    lines.push("", D.noGuarantee[state.lang]);
    return lines.join("\n");
  }

  function copyText(text, btn, label) {
    function fallback() {
      var ta = el("textarea", "exp"); ta.value = text; ta.readOnly = true; btn.parentNode.parentNode.appendChild(ta); ta.focus(); ta.select();
      btn.textContent = t("copy_failed");
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { btn.textContent = t("copied"); setTimeout(function () { btn.textContent = label; }, 1800); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------- feedback (stored on this device only) ---------- */
  function loadFb() { try { state.fb = JSON.parse(store.get("ks_feedback") || "[]"); } catch (e) { state.fb = []; } if (!Array.isArray(state.fb)) state.fb = []; }
  function csvCell(s) { s = String(s == null ? "" : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function fbCsv() {
    var head = ["time", "ui_language", "message_language", "verdict", "feedback", "rules", "text"];
    return [head.join(",")].concat(state.fb.map(function (r) { return head.map(function (h) { return csvCell(r[h]); }).join(","); })).join("\n");
  }
  function feedbackBox(res) {
    var box = el("div", "card"); box.appendChild(el("h4", "", t("feedback_q")));
    var row = el("div", "fb"), picked = null, btns = [];
    [["right", t("fb_right")], ["missed", t("fb_missed")], ["false_alarm", t("fb_false")]].forEach(function (o) {
      var b = el("button", "chip", o[1]); b.type = "button"; b.setAttribute("aria-pressed", "false"); btns.push(b);
      b.addEventListener("click", function () {
        picked = o[0]; btns.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        state.fb.push({ time: new Date().toISOString(), ui_language: state.lang, message_language: res.language, verdict: res.verdict, feedback: o[0],
          rules: res.findings.map(function (f) { return f.id; }).join(" "), text: inc.checked ? res.text : "" });
        store.set("ks_feedback", JSON.stringify(state.fb)); status.textContent = t("fb_thanks") + " (" + state.fb.length + " " + t("fb_count") + ")";
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    var incRow = el("label", "small"); incRow.style.cssText = "display:flex;gap:8px;align-items:center;margin-top:10px";
    var inc = el("input"); inc.type = "checkbox"; inc.id = "fbInclude"; incRow.appendChild(inc); incRow.appendChild(document.createTextNode(t("fb_include"))); box.appendChild(incRow);
    var status = el("p", "small"); status.setAttribute("role", "status"); box.appendChild(status);
    var ex = el("div", "row"), exp = el("button", "chip", t("fb_export")); exp.type = "button";
    exp.addEventListener("click", function () { copyText(fbCsv(), exp, t("fb_export")); });
    var clr = el("button", "chip", t("fb_clear")); clr.type = "button";
    clr.addEventListener("click", function () { state.fb = []; store.set("ks_feedback", "[]"); status.textContent = ""; });
    ex.appendChild(exp); ex.appendChild(clr); box.appendChild(ex);
    box.appendChild(el("p", "small", t("fb_help")));
    return box;
  }

  /* ---------- actions ---------- */
  function run() {
    var text = $("msg").value;
    if (!text.trim()) { state.last = null; var o = clear($("result")); o.appendChild(el("div", "card", t("paste_first"))); return; }
    state.last = K.analyze(D, text); renderResult(state.last);
  }
  function setLang(l) {
    state.lang = l; store.set("ks_lang", l);
    if (state.exampleActive) { loadExample(0); } else { renderStatic(); renderResult(state.last); }
  }
  function loadExample(i) {
    var ex = (D.examples[state.lang] || [])[i]; if (!ex) { renderStatic(); return; }
    $("msg").value = ex.text; state.exampleActive = true; renderStatic(); run();
  }
  function setTab(name) {
    state.tab = name;
    ["check", "learn", "about"].forEach(function (n) { $("p-" + n).hidden = n !== name; $("tab-" + n).setAttribute("aria-selected", String(n === name)); });
  }
  function applyTheme() {
    var r = document.documentElement; if (state.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
  }

  function init() {
    loadFb();
    var saved = store.get("ks_lang"), nav = ((navigator.language || "en") + "").slice(0, 2).toLowerCase();
    state.lang = D.langs.indexOf(saved) >= 0 ? saved : (D.langs.indexOf(nav) >= 0 ? nav : "en");
    var sz = parseInt(store.get("ks_size") || "0", 10); state.size = sz >= 0 && sz < SIZES.length ? sz : 0;
    var th = store.get("ks_theme"); state.theme = THEMES.indexOf(th) >= 0 ? th : "auto";
    document.documentElement.style.fontSize = SIZES[state.size] + "%"; applyTheme();
    $("go").addEventListener("click", function () { state.exampleActive = false; $("exTag").hidden = true; run(); });
    $("clear").addEventListener("click", function () { $("msg").value = ""; state.exampleActive = false; state.last = null; clear($("result")); $("exTag").hidden = true; $("msg").focus(); });
    $("msg").addEventListener("input", function () { if (state.exampleActive) { state.exampleActive = false; $("exTag").hidden = true; } });
    $("examples").addEventListener("change", function (e) { if (e.target.value !== "") loadExample(parseInt(e.target.value, 10)); });
    $("sizeBtn").addEventListener("click", function () { state.size = (state.size + 1) % SIZES.length; store.set("ks_size", String(state.size)); document.documentElement.style.fontSize = SIZES[state.size] + "%"; renderStatic(); });
    $("themeBtn").addEventListener("click", function () { state.theme = THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]; store.set("ks_theme", state.theme); applyTheme(); renderStatic(); });
    ["check", "learn", "about"].forEach(function (n) { $("tab-" + n).addEventListener("click", function () { setTab(n); }); });
    loadExample(0);
  }
  init();
})();

</script>
