 Asante.","fb_export":"Nakili maoni yangu kama CSV","fb_count":"ripoti zilizohifadhiwa","fb_include":"Jumuisha maandishi ya ujumbe kwenye usafirishaji","fb_help":"Ripoti husaidia kuboresha kanuni. Hakuna kinachotumwa isipokuwa ukinakili na kushiriki mwenyewe.","text_size":"Ukubwa wa maandishi","theme":"Mandhari","learn_title":"Tabia tano zinazozuia utapeli mwingi","tips":["Usibonyeze viungo wala kupiga namba zilizo kwenye ujumbe usioutarajia.","Kamwe usishiriki PIN, nenosiri au msimbo wa mara moja, hata na mtu anayesema anafanya kazi benki yako.","Hulipi ada yoyote ili upokee zawadi, mkopo au ufadhili.","Hakiki mwenyewe na taasisi, kupitia tovuti yake rasmi, kadi yako au tawi.","Zungumza na mtu unayemwamini kabla ya kutuma pesa, hasa ukiambiwa uharakishe au uweke siri."],"about_title":"Kuhusu KinyaShield RW","about":["Regis KinyaShield RW ni mradi wa usalama wa mtandao na AI unaolenga usalama wa kidijitali, uelewa wa vitisho na ulinzi wa busara dhidi ya hatari za mtandaoni. Una sehemu ya usalama wa mtandao (hakiki jumbe, jifunze, mwongozo wa usalama) na sehemu ya AI ambapo unaweza kuuliza chochote na kupata jibu kwa Kiingereza, Kifaransa, Kinyarwanda au Kiswahili.","KinyaShield inaeleza kwa nini ujumbe unaweza kuwa wa kutiliwa shaka, kwa Kiingereza, Kifaransa, Kinyarwanda na Kiswahili.","Inatumia kanuni zilizoandikwa unazoweza kusoma, si modeli iliyofichwa. Kila tahadhari inaonyesha maneno halisi yaliyoisababisha.","Ni kisaidizi cha uamuzi. Haiwezi kuthibitisha kuwa ujumbe ni salama, na inaweza kukosa mbinu mpya, hasa jumbe zinazosikika za kawaida.","Kanuni na maneno ya Kifaransa, Kinyarwanda na Kiswahili ni rasimu hadi wazungumzaji fasaha wazikague.","Imejaribiwa kwa jumbe fupi za kubuni zilizoandikwa na mmiliki wa mradi pekee. Usahihi wa matumizi halisi bado haujulikani."],"sources_title":"Mahali pa kupata msaada rasmi","sources_note":"Tafuta mwenyewe mawasiliano kwenye tovuti rasmi. Programu hii haionyeshi namba za simu kwa makusudi.","sev_high":"Juu","sev_medium":"Wastani","sev_low":"Ndogo","theme_auto":"Otomatiki","theme_light":"Mwanga","theme_dark":"Giza","example_note":"Mfano wa ujumbe wa kubuni","result_head":"Matokeo ya KinyaShield","scam_types_title":"Aina za kawaida za utapeli","works_offline":"Ukurasa huu ukishapakia unaendelea kufanya kazi bila intaneti.","reasons":"Sababu","version":"Toleo","rules_count":"kanuni","no_reasons":"Hakuna dalili zilizolingana","fb_clear":"Futa ripoti zilizohifadhiwa","fb_shown":"Ripoti imehifadhiwa","lang_guess_unknown":"haijulikani","tab_ask":"Uliza","ask_title":"Uliza swali la usalama","ask_welcome":"Uliza kuhusu utapeli, usalama wa pesa kwa simu, nenosiri, simu zilizopotea na mengineyo. Majibu yanatoka kwenye mwongozo ulioandikwa na timu ya KinyaShield.","ask_placeholder":"Andika swali lako…","ask_send":"Uliza","ask_try":"Jaribu kuuliza","ask_unknown":"Sina jibu la kuaminika kwa hilo kwenye mwongozo wangu, kwa hiyo sitakisia. Jaribu kuandika tofauti, chagua mada hapa chini, au uulize benki yako, mtoa huduma wako au mamlaka.","ask_from_guide":"Kutoka mwongozo wa KinyaShield","ask_related":"Maswali yanayohusiana","ask_steps":"Cha kufanya","ask_check_msg":"Hii inaonekana kama ujumbe uliopokea. Uhakiki kwenye kichupo cha «Hakiki»","ask_open_check":"Hakiki ujumbe huu","ask_mode_guide":"Mwongozo","ask_mode_ai":"Claude AI","ask_mode":"Chanzo cha jibu","ask_ai_note":"Claude hujibu swali lolote, lakini anaweza kukosea. Usimtegemee kwa maamuzi ya pesa, sheria au afya, na usibandike misimbo ya siri.","ask_ai_thinking":"Anafikiri…","ask_stop":"Simamisha","ask_ai_btn":"Muulize Claude","ask_ai_label":"Claude (AI)","ask_you":"Wewe","ask_new":"Gumzo jipya","ask_ai_rate":"Maombi ni mengi mno. Subiri kidogo kisha ujaribu tena.","ask_ai_error":"Claude hakuweza kujibu sasa. Mwongozo bado unafanya kazi.","ask_ai_denied":"Claude hakuruhusiwa kujibu. Mwongozo bado unafanya kazi.","ask_ai_stopped":"Imesimamishwa.","ask_disclaimer":"Taarifa za jumla tu. Si ushauri wa kisheria, kifedha wala kiafya.","tab_cyber":"Usalama wa mtandao","tab_gen":"Uliza chochote","sub_ask":"Maswali ya usalama","sub_check":"Hakiki ujumbe","gen_title":"Niulize chochote","gen_welcome":"Uliza kuhusu mada yoyote, kwa Kiingereza, Kifaransa, Kinyarwanda au Kiswahili: shule, afya ya msingi, kazi, uandishi, teknolojia, maisha ya kila siku.","gen_need_ai":"Majibu ya maswali huru yanahitaji Claude AI, inayofanya kazi tu ukurasa huu ukifunguliwa ndani ya claude.ai. Sehemu ya Usalama wa mtandao bado inafanya kazi hapa, hata bila intaneti.","gen_placeholder":"Uliza chochote…","gen_sugg":["Eleza kwa maneno rahisi chanjo zinavyofanya kazi","Nisaidie kuandika ujumbe wa heshima kumuomba mteja alipe","Njia nzuri za kujisomea mitihani ni zipi?","Riba ya mkopo wa benki inafanyaje kazi?"]}},"sources":[{"name":"National Cyber Security Authority (NCSA), Rwanda","use":{"en":"Official cyber-security guidance and awareness material for Rwanda.","rw":"Inama n'ibikoresho byo gukangurira ku mutekano wa murandasi mu Rwanda.","fr":"Conseils officiels et matériel de sensibilisation sur la cybersécurité au Rwanda.","sw":"Mwongozo rasmi na vifaa vya uhamasishaji kuhusu usalama wa mtandao nchini Rwanda."},"url":"https://www.ncsa.gov.rw","verified":false},{"name":"Your bank or mobile-money provider (official website, card or branch)","use":{"en":"The only reliable way to confirm a message that claims to come from them.","rw":"Inzira yonyine yizewe yo kwemeza ubutumwa buvuga ko buturutse kuri bo.","fr":"Le seul moyen fiable de confirmer un message qui prétend venir d'eux.","sw":"Njia pekee ya kuaminika ya kuthibitisha ujumbe unaodai kutoka kwao."},"url":"","verified":true}],"sourcesNote":{"en":"Addresses marked unverified must be checked by the project owner before release.","rw":"Aderesi zanditseho 'unverified' zigomba kugenzurwa na nyiri umushinga mbere yo gusohora."},"examples":{"en":[{"text":"Congratulations! You have won 2,000,000 RWF in the MoMo lucky draw. Pay 15,000 RWF registration fee to receive your prize today.","kind":"suspicious"},{"text":"Dear customer, your MTN account will be suspended within 24 hours. Send your PIN to 0780000000 to verify.","kind":"suspicious"},{"text":"Your scholarship application is approved. To release your funds, send 20,000 RWF processing fee to the number below.","kind":"suspicious"},{"text":"I sent you 50,000 RWF by mistake. Please send back the money to my number, I am in hospital.","kind":"suspicious"},{"text":"Your OTP is 482913. Do not share it with anyone, including MTN staff.","kind":"legitimate"},{"text":"We will never ask you for your PIN or password by SMS or phone call.","kind":"legitimate"},{"text":"Reminder: your school fees for Term 2 are due on 15 May. Pay at the bursar's office or through the school's official account.","kind":"legitimate"}],"fr":[{"text":"Félicitations ! Vous avez gagné 2 000 000 RWF au tirage MoMo. Payez 15 000 RWF de frais d'inscription pour recevoir votre gain aujourd'hui.","kind":"suspicious"},{"text":"Cher client, votre compte MTN sera suspendu dans les 24 heures. Envoyez votre code PIN au 0780000000 pour vérifier.","kind":"suspicious"},{"text":"Votre bourse est approuvée. Pour débloquer vos fonds, envoyez 20 000 RWF de frais de dossier au numéro ci-dessous.","kind":"suspicious"},{"text":"Je vous ai envoyé 50 000 RWF par erreur. Renvoyez-moi l'argent s'il vous plaît, je suis à l'hôpital.","kind":"suspicious"},{"text":"Votre code OTP est 482913. Ne le partagez avec personne, y compris le personnel MTN.","kind":"legitimate"},{"text":"Nous ne vous demanderons jamais votre code PIN ni votre mot de passe par SMS ou par appel.","kind":"legitimate"},{"text":"Rappel : les frais de scolarité du trimestre 2 sont dus le 15 mai. Payez à la caisse de l'école ou sur le compte officiel.","kind":"legitimate"}],"rw":[{"text":"Mwiriwe, watsindiye miliyoni 2 muri tombola ya MoMo. Ishyura amafaranga 15,000 Frw kugira ngo ubone igihembo cyawe.","kind":"suspicious"},{"text":"Konti yawe ya MTN izafungwa mu masaha 24. Ohereza umubare w'ibanga wawe kuri 0780000000 ubu nonaha.","kind":"suspicious"},{"text":"Nakohereje amafaranga 50,000 Frw kubw'impanuka. Nsubiza amafaranga yanjye vuba.","kind":"suspicious"},{"text":"Kanda hano https://bit.ly/abc123 wemeze konti yawe cyangwa izafungwa.","kind":"suspicious"},{"text":"Kode yawe ni 482913. Ntugasangize iyi kode n'undi muntu.","kind":"legitimate"},{"text":"Ntituzigera tukubaza umubare w'ibanga wawe kuri telefoni cyangwa SMS.","kind":"legitimate"},{"text":"Murakoze kwishyura. Wishyuye 5,000 Frw ku wa 12 Gicurasi.","kind":"legitimate"}],"sw":[{"text":"Hongera! Umeshinda TSh 2,000,000 kwenye droo ya bahati nasibu ya M-Pesa. Lipa ada ya usajili ya TSh 15,000 ili upokee zawadi yako leo.","kind":"suspicious"},{"text":"Mteja mpendwa, akaunti yako itafungwa ndani ya saa 24. Tuma PIN yako kwa 0780000000 ili kuthibitisha.","kind":"suspicious"},{"text":"Maombi yako ya ufadhili yamekubaliwa. Ili upokee fedha zako, tuma ada ya usindikaji ya RWF 20,000 kwa namba iliyo hapa chini.","kind":"suspicious"},{"text":"Nimekutumia TSh 50,000 kimakosa. Tafadhali nirudishie pesa zangu, niko hospitalini.","kind":"suspicious"},{"text":"Msimbo wako wa OTP ni 482913. Usimshirikishe mtu yeyote, ikiwemo wafanyakazi wa Vodacom.","kind":"legitimate"},{"text":"Hatutakuomba kamwe PIN au nenosiri lako kwa SMS au simu.","kind":"legitimate"},{"text":"Kumbusho: ada ya shule ya muhula wa 2 inadaiwa tarehe 15 Mei. Lipa kwa karani wa shule au kupitia akaunti rasmi ya shule.","kind":"legitimate"}]},"guide":[{"id":"phishing_basics","related":["check_link","verify_sender","pin_otp_rules"],"title":{"en":"How to spot a scam message","fr":"Reconnaître un message d'arnaque","rw":"Uko wamenya ubutumwa bw'uburiganya","sw":"Jinsi ya kutambua ujumbe wa utapeli"},"keywords":{"en":["scam","scams","scam message*","fake message*","how to spot","spot a scam","recognise","recognize","phishing","suspicious message*","warning signs","red flag*","smishing"],"fr":["arnaque*","escroquerie*","phishing","hamecon*","faux message*","message suspect*","reconnaitre","signes d'alerte","reperer","sms frauduleux"],"rw":["uburiganya","ubutumwa bw'uburiganya","gutahura","kumenya uburiganya","ibimenyetso by'uburiganya","abatekamutwe","umutekamutwe"],"sw":["utapeli","ulaghai","tapeli*","ujumbe wa utapeli","kutambua","dalili za utapeli","ujumbe wa kutiliwa shaka","matapeli"]},"answer":{"en":"Most scam messages push you to act fast, ask for a secret code or money, or send you to a link you did not expect. You can test any message in the Check tab.","fr":"La plupart des messages d'arnaque vous pressent d'agir vite, demandent un code secret ou de l'argent, ou vous envoient vers un lien inattendu. Vous pouvez tester un message dans l'onglet Vérifier.","rw":"Ubutumwa bwinshi bw'uburiganya bukwihutisha, busaba kode y'ibanga cyangwa amafaranga, cyangwa bukwohereza ku ihuza utari witeze. Ushobora kugenzura ubutumwa mu gice cyitwa «Genzura».","sw":"Jumbe nyingi za utapeli hukusukuma kuchukua hatua haraka, kuomba msimbo wa siri au pesa, au kukupeleka kwenye kiungo usichotarajia. Unaweza kuhakiki ujumbe kwenye kichupo cha «Hakiki»."},"steps":{"en":["Be suspicious of prizes, urgent threats and requests for money or codes.","Do not click links or call numbers inside the message.","Contact the organisation using details from its official website or your card.","Ask someone you trust before acting."],"fr":["Méfiez-vous des gains, des menaces urgentes et des demandes d'argent ou de code.","Ne cliquez pas sur les liens et n'appelez pas les numéros du message.","Contactez l'organisme avec les coordonnées de son site officiel ou de votre carte.","Demandez l'avis d'une personne de confiance avant d'agir."],"rw":["Ujye witonda iyo bavuze ibihembo, iterabwoba ryihutirwa cyangwa basaba amafaranga cyangwa kode.","Ntukande amahuza kandi ntuhamagare nimero ziri mu butumwa.","Vugana n'ikigo ukoresheje amakuru ari ku rubuga rwacyo rwemewe cyangwa ku ikarita yawe.","Baza umuntu wizeye mbere yo gukora."],"sw":["Kuwa makini na zawadi, vitisho vya haraka na maombi ya pesa au misimbo.","Usibofye viungo wala kupiga namba zilizo kwenye ujumbe.","Wasiliana na taasisi kwa taarifa za tovuti yake rasmi au kadi yako.","Mwombe ushauri mtu unayemwamini kabla ya kuchukua hatua."]}},{"id":"pin_otp_rules","related":["shared_pin","whatsapp_hijack","two_step"],"title":{"en":"Who can ask for my PIN or code?","fr":"Qui peut me demander mon PIN ou un code ?","rw":"Ni nde ushobora kunsaba PIN cyangwa kode?","sw":"Nani anaweza kuniomba PIN au msimbo?"},"keywords":{"en":["pin","otp","one-time code","one time code","verification code","secret code","who can ask","share my pin","bank ask*","asks for my pin","code sms"],"fr":["pin","code pin","otp","code secret","code de verification","qui peut demander","partager mon code","code recu par sms","code a usage unique"],"rw":["pin","kode","umubare w'ibanga","ijambo ry'ibanga","ni nde ushobora","gutanga kode","kode y'inyongera"],"sw":["pin","msimbo","nambari ya siri","namba ya siri","nenosiri","nani anaweza","kushiriki msimbo","msimbo wa mara moja"]},"answer":{"en":"Nobody should ask you for your PIN, password or one-time code: not your bank, mobile-money company or police, and not their staff. These are for you alone.","fr":"Personne ne doit vous demander votre PIN, mot de passe ou code à usage unique : ni votre banque, ni l'opérateur de mobile money, ni la police, ni leurs employés. Ils sont faits pour vous seul.","rw":"Nta muntu ugomba kugusaba PIN, ijambo ry'ibanga cyangwa kode y'inyongera: si banki yawe, si ikigo cya mobile money, si polisi, cyangwa abakozi babo. Ni ibyawe wenyine.","sw":"Hakuna anayepaswa kukuomba PIN, nenosiri au msimbo wa mara moja: si benki yako, si kampuni ya pesa kwa simu, si polisi, wala wafanyakazi wao. Ni vyako peke yako."},"steps":{"en":["If someone asks, refuse and end the contact.","A code sent by SMS is only for something you started yourself.","Change your PIN if you think someone saw it.","Use the official app or a branch to check any request."],"fr":["Si quelqu'un vous le demande, refusez et coupez le contact.","Un code reçu par SMS ne sert que pour une action que vous avez lancée vous-même.","Changez votre PIN si vous pensez que quelqu'un l'a vu.","Utilisez l'application officielle ou une agence pour vérifier toute demande."],"rw":["Iyo hari ubigusabye, banga maze uhagarike ikiganiro.","Kode wakiriye kuri SMS ikoreshwa gusa ku kintu watangiye ubwawe.","Hindura PIN yawe niba ukeka ko hari uwayibonye.","Koresha porogaramu cyangwa ibiro byemewe kugira ngo ugenzure icyo gusaba cyose."],"sw":["Mtu akikuomba, kataa na ukate mawasiliano.","Msimbo unaopokea kwa SMS ni kwa jambo ulilolianzisha mwenyewe tu.","Badilisha PIN yako ukidhani mtu ameiona.","Tumia programu au tawi rasmi kuhakiki ombi lolote."]}},{"id":"shared_pin","related":["sent_money_scammer","sim_swap","where_to_report"],"title":{"en":"I shared my PIN or code. What now?","fr":"J'ai donné mon PIN ou un code. Que faire ?","rw":"Natanze PIN cyangwa kode. Nkore iki?","sw":"Nimetoa PIN au msimbo. Nifanye nini?"},"keywords":{"en":["i shared my pin","i gave my pin","i gave my code","i gave my password","gave my password","gave my pin","gave my code","told them my code","sent my pin","gave otp","shared otp","already shared","i was hacked","account hacked","money gone","money stolen","someone has my pin"],"fr":["j'ai donne mon pin","j'ai donne mon code","j'ai partage mon","code donne","argent vole","compte pirate","piratage","j'ai envoye mon pin"],"rw":["natanze pin","natanze kode","nahaye kode","nohereje pin","konti yanjye yibwe","amafaranga yanjye yibwe","bambye amafaranga"],"sw":["nimetoa pin","nimetoa msimbo","nimetuma pin","nimeibiwa","pesa zimeibiwa","akaunti imedukuliwa","nimempa msimbo"]},"answer":{"en":"Act within minutes. Contact your bank or mobile-money provider through an official channel, tell them what happened, and ask them to secure your account.","fr":"Agissez en quelques minutes. Contactez votre banque ou opérateur par son canal officiel, expliquez ce qui s'est passé et demandez de sécuriser votre compte.","rw":"Ihutire gukora mu minota mike. Vugana na banki yawe cyangwa ikigo cya mobile money unyuze mu nzira yemewe, ubabwire ibyabaye, ubasabe kurinda konti yawe.","sw":"Chukua hatua ndani ya dakika chache. Wasiliana na benki au mtoa huduma wa pesa kwa simu kupitia njia rasmi, waeleze kilichotokea na uwaombe walinde akaunti yako."},"steps":{"en":["Change your PIN or password now, from your own phone.","Call the provider on a number from its official website or your card and ask to block or secure the account.","Check recent transactions and write down times, amounts and numbers.","Report it to the police and warn family so they are not targeted next."],"fr":["Changez tout de suite votre PIN ou mot de passe depuis votre téléphone.","Appelez le fournisseur avec un numéro de son site officiel ou de votre carte et demandez de bloquer ou sécuriser le compte.","Vérifiez les transactions récentes et notez heures, montants et numéros.","Signalez-le à la police et prévenez vos proches pour qu'ils ne soient pas visés."],"rw":["Hindura PIN cyangwa ijambo ry'ibanga ubu nonaha, ukoresheje telefoni yawe.","Hamagara ikigo ukoresheje nimero iri ku rubuga rwacyo rwemewe cyangwa ku ikarita yawe, usabe ko konti ifungwa cyangwa irindwa.","Reba ibyakozwe vuba, wandike igihe, amafaranga na nimero.","Tanga ikirego kuri polisi kandi umenyeshe umuryango kugira ngo na bo batagirwaho ingaruka."],"sw":["Badilisha PIN au nenosiri sasa hivi, kwa simu yako mwenyewe.","Piga simu kwa namba iliyo kwenye tovuti rasmi au kadi yako, kisha uombe akaunti izuiwe au ilindwe.","Angalia miamala ya hivi karibuni na uandike muda, kiasi na namba.","Ripoti polisi na uwaambie familia ili wasilengwe pia."]}},{"id":"sent_money_scammer","related":["where_to_report","shared_pin","investment_scams"],"title":{"en":"I sent money to a scammer","fr":"J'ai envoyé de l'argent à un escroc","rw":"Nohereje amafaranga ku mutekamutwe","sw":"Nimetuma pesa kwa tapeli"},"keywords":{"en":["sent money to a scammer","i paid a scammer","got scammed","been scammed","recover my money","get my money back","reverse transaction","reverse the transaction","lost money","scammed me"],"fr":["envoye de l'argent a un escroc","paye un escroc","je me suis fait arnaquer","recuperer mon argent","annuler la transaction","perdu de l'argent","arnaque*"],"rw":["nohereje amafaranga ku mutekamutwe","natekewe umutwe","gusubirana amafaranga","nasubizwa amafaranga","nahombye amafaranga","nibwe amafaranga"],"sw":["nimetuma pesa kwa tapeli","nimetapeliwa","kurudisha pesa","kurejeshewa pesa","nimepoteza pesa","kubatilisha muamala"]},"answer":{"en":"Report it straight away. The sooner the provider knows, the better the chance of stopping or tracing the payment, though getting money back is never guaranteed.","fr":"Signalez-le tout de suite. Plus le fournisseur le sait tôt, plus il a de chances de bloquer ou tracer le paiement, mais récupérer l'argent n'est jamais garanti.","rw":"Tanga ikirego ako kanya. Uko ikigo kibimenya vuba, ni ko amahirwe yo guhagarika cyangwa gukurikirana ubwishyu aba menshi, nubwo gusubirana amafaranga bitigera byizerwa.","sw":"Ripoti mara moja. Mtoa huduma akijua mapema, ndivyo uwezekano wa kuzuia au kufuatilia malipo unavyoongezeka, ingawa kurejeshewa pesa hakuhakikishwi kamwe."},"steps":{"en":["Contact your provider or bank at once through an official channel and give the transaction details.","Keep screenshots, numbers and messages as evidence. Do not delete them.","Report to the police and ask for a reference number.","Ignore anyone who offers to 'recover' your money for a fee; that is often a second scam."],"fr":["Contactez immédiatement votre fournisseur ou banque par un canal officiel avec les détails de la transaction.","Gardez captures d'écran, numéros et messages comme preuves. Ne les supprimez pas.","Déposez plainte à la police et demandez un numéro de référence.","Ignorez toute personne qui propose de « récupérer » votre argent contre des frais : c'est souvent une seconde arnaque."],"rw":["Vugana ako kanya n'ikigo cyawe cyangwa banki unyuze mu nzira yemewe, utange amakuru y'igikorwa.","Bika amashusho y'ecran, nimero n'ubutumwa nk'ibimenyetso. Ntubisibe.","Tanga ikirego kuri polisi usabe nomero y'ikirego.","Ntukumve umuntu wese ukwemerera «kugarura» amafaranga yawe ayishyuye; akenshi ni uburiganya bwa kabiri."],"sw":["Wasiliana na mtoa huduma au benki mara moja kupitia njia rasmi na utoe maelezo ya muamala.","Hifadhi picha za skrini, namba na jumbe kama ushahidi. Usizifute.","Ripoti polisi na uombe namba ya kumbukumbu.","Puuza yeyote anayejitolea 'kurejesha' pesa zako kwa ada; mara nyingi ni utapeli wa pili."]}},{"id":"mistaken_transfer","related":["sent_money_scammer","verify_sender","shared_pin"],"title":{"en":"Someone says they sent me money by mistake","fr":"Quelqu'un dit m'avoir envoyé de l'argent par erreur","rw":"Hari uvuga ko yanyoherereje amafaranga kubw'impanuka","sw":"Mtu anasema alinitumia pesa kimakosa"},"keywords":{"en":["sent by mistake","sent money by mistake","wrong number","send it back","return the money","accidentally sent","sent to me by mistake","refund me"],"fr":["par erreur","mauvais numero","renvoyer l'argent","rendre l'argent","envoye par megarde","remboursez moi"],"rw":["kubw'impanuka","kwibeshya","nsubiza amafaranga","subiza amafaranga","nakohereje nabi","yanyoherereje amafaranga"],"sw":["kimakosa","kwa makosa","namba mbaya","nirudishie pesa","rudisha pesa","alinitumia pesa","nilituma pesa"]},"answer":{"en":"Do not send anything back until you have checked your own balance in the official app or at an agent. Often the 'mistaken' payment never arrived, or it is reversed later and you lose your own money.","fr":"N'envoyez rien tant que vous n'avez pas vérifié votre solde dans l'application officielle ou chez un agent. Souvent le paiement « par erreur » n'est jamais arrivé, ou il est annulé ensuite et vous perdez votre propre argent.","rw":"Ntugire icyo wohereza keretse umaze kureba amafaranga ufite muri porogaramu yemewe cyangwa ku mukozi. Akenshi ubwishyu «bw'impanuka» ntibwigeze buza, cyangwa busubizwa nyuma ugatakaza amafaranga yawe.","sw":"Usitume chochote hadi uangalie salio lako kwenye programu rasmi au kwa wakala. Mara nyingi malipo ya 'makosa' hayakufika kamwe, au hubatilishwa baadaye na ukapoteza pesa zako mwenyewe."},"steps":{"en":["Check your balance and the message yourself in the official app.","If the money is really there, tell your provider and ask them to handle the return.","Never return money to a number the caller gives you.","Do not share codes or your PIN with the person."],"fr":["Vérifiez vous-même votre solde et le message dans l'application officielle.","Si l'argent est bien là, prévenez votre fournisseur et demandez-lui de gérer le retour.","Ne renvoyez jamais d'argent vers un numéro donné par l'appelant.","Ne partagez ni code ni PIN avec cette personne."],"rw":["Reba ubwawe amafaranga ufite n'ubutumwa muri porogaramu yemewe.","Niba amafaranga ahari koko, menyesha ikigo cyawe ubasabe gukora isubiza.","Ntukigere usubiza amafaranga kuri nimero uwaguhamagaye aguhaye.","Ntugire PIN cyangwa kode utanga kuri uwo muntu."],"sw":["Angalia salio na ujumbe mwenyewe kwenye programu rasmi.","Ikiwa pesa zipo kweli, mjulishe mtoa huduma wako ili ashughulikie marejesho.","Usirudishe kamwe pesa kwa namba aliyokupa mpigaji.","Usishiriki msimbo wala PIN na mtu huyo."]}},{"id":"fake_prize","related":["phishing_basics","job_visa_scam","check_link"],"title":{"en":"I got a message saying I won a prize","fr":"J'ai reçu un message disant que j'ai gagné un prix","rw":"Nabonye ubutumwa buvuga ko nabonye igihembo","sw":"Nimepata ujumbe unaosema nimeshinda zawadi"},"keywords":{"en":["won a prize","you won","i won","lottery","lucky draw","winner","free phone","free gift","claim prize","claim my prize","selected to receive","giveaway"],"fr":["gagne un prix","vous avez gagne","loterie","tirage","gagnant","telephone gratuit","cadeau gratuit","reclamer mon gain","concours"],"rw":["watsindiye","igihembo","tombola","igihembo cy'ubuntu","telefoni y'ubuntu","guhabwa igihembo","nabonye igihembo"],"sw":["umeshinda","nimeshinda","zawadi","bahati nasibu","mshindi","simu bure","zawadi ya bure","umechaguliwa"]},"answer":{"en":"If you did not enter a draw you cannot win it. A real prize never needs you to pay a fee, share a PIN or give your ID number first.","fr":"Si vous n'avez pas participé à un tirage, vous ne pouvez pas le gagner. Un vrai gain ne demande jamais de payer des frais, de donner un PIN ou votre numéro d'identité d'abord.","rw":"Niba utarigeze ujya mu mikino ya tombola, ntushobora kuyitsinda. Igihembo nyakuri ntigisaba kwishyura amafaranga, gutanga PIN cyangwa nomero y'indangamuntu mbere.","sw":"Ikiwa hukushiriki droo, huwezi kuishinda. Zawadi halisi haikuombi kamwe kulipa ada, kutoa PIN au namba ya kitambulisho kwanza."},"steps":{"en":["Ignore and delete the message.","Never pay a 'delivery', 'tax' or 'registration' fee to receive a prize.","Do not click the link or reply.","Warn friends who may get the same message."],"fr":["Ignorez et supprimez le message.","Ne payez jamais de frais de « livraison », de « taxe » ou d'« inscription » pour recevoir un gain.","Ne cliquez pas sur le lien et ne répondez pas.","Prévenez vos amis qui pourraient recevoir le même message."],"rw":["Ntubyiteho ubisibe.","Ntukigere wishyura amafaranga ya «kohereza», «umusoro» cyangwa «kwiyandikisha» kugira ngo uhabwe igihembo.","Ntukande ihuza kandi ntusubize.","Menyesha inshuti zishobora kubona ubwo butumwa."],"sw":["Puuza na ufute ujumbe.","Usilipe kamwe ada ya 'usafirishaji', 'kodi' au 'usajili' ili upokee zawadi.","Usibofye kiungo wala kujibu.","Waonye marafiki wanaoweza kupokea ujumbe huo."]}},{"id":"job_visa_scam","related":["relative_emergency","loan_apps","investment_scams"],"title":{"en":"A job abroad, visa or loan that asks me to pay first","fr":"Emploi à l'étranger, visa ou prêt avec paiement d'avance","rw":"Akazi hanze, viza cyangwa inguzanyo isaba kwishyura mbere","sw":"Kazi nje ya nchi, viza au mkopo unaoomba kulipa kwanza"},"keywords":{"en":["job abroad","work abroad","visa fee","visa","job offer","recruiter","fake job","loan fee","insurance fee","pay to get a job","dubai","scholarship fee","work permit","vacancy"],"fr":["emploi a l'etranger","travailler a l'etranger","frais de visa","visa","offre d'emploi","recruteur","faux emploi","frais de pret","frais d'assurance","payer pour un emploi","dubai","frais de bourse"],"rw":["akazi hanze","viza","amahirwe y'akazi","ubwishingizi","kwishyura kugira ngo mbone akazi","buruse","dubai","inguzanyo isaba kwishyura"],"sw":["kazi nje ya nchi","viza","ofa ya kazi","ada ya bima","kulipa kupata kazi","ufadhili","dubai","mwajiri"]},"answer":{"en":"Real employers, lenders and scholarship offices do not ask for 'insurance', 'visa' or 'processing' money before they pay you or start. Fake offers also push you to move quickly to WhatsApp or Telegram.","fr":"Les vrais employeurs, prêteurs et services de bourses ne demandent pas d'argent pour « l'assurance », le « visa » ou le « dossier » avant de vous payer ou de commencer. Les fausses offres vous poussent aussi à passer vite sur WhatsApp ou Telegram.","rw":"Abakoresha, abaguriza n'ibiro bitanga buruse nyabo ntibasaba amafaranga ya «ubwishingizi», «viza» cyangwa «ibyangombwa» mbere yo kukwishyura cyangwa gutangira. Amatangazo y'ibinyoma kandi agusunikira kujya vuba kuri WhatsApp cyangwa Telegram.","sw":"Waajiri, wakopeshaji na ofisi za ufadhili halali hawaombi pesa za 'bima', 'viza' au 'usindikaji' kabla ya kukulipa au kuanza. Ofa bandia pia hukusukuma kuhamia haraka WhatsApp au Telegram."},"steps":{"en":["Do not pay anything up front.","Check the company and the recruiter yourself on official sources.","Ask for a written contract and read it with someone you trust.","Report fake offers to the police and to the platform where you saw them."],"fr":["Ne payez rien d'avance.","Vérifiez vous-même l'entreprise et le recruteur sur des sources officielles.","Demandez un contrat écrit et lisez-le avec une personne de confiance.","Signalez les fausses offres à la police et à la plateforme où vous les avez vues."],"rw":["Ntukishyure ikintu icyo ari cyo cyose mbere.","Genzura ubwawe ikigo n'uwakoresha mu nzira zemewe.","Saba amasezerano yanditse uyasome hamwe n'umuntu wizeye.","Tanga ikirego ku bapolisi no ku rubuga wabonyeho iryo tangazo."],"sw":["Usilipe chochote mapema.","Hakiki kampuni na mwajiri mwenyewe kwa vyanzo rasmi.","Omba mkataba ulioandikwa na uusome pamoja na mtu unayemwamini.","Ripoti ofa bandia polisi na kwenye jukwaa ulikoziona."]}},{"id":"relative_emergency","related":["voice_clone_boss","mistaken_transfer","whatsapp_hijack"],"title":{"en":"A 'relative' asks for money from a new number","fr":"Un « proche » demande de l'argent depuis un nouveau numéro","rw":"«Umuvandimwe» ansaba amafaranga akoresheje nimero nshya","sw":"'Ndugu' anaomba pesa kwa namba mpya"},"keywords":{"en":["new number","it is me","it's me","changed my number","emergency","my son","my daughter","mum","mom","relative","family member","stranded","hospital","send me money"],"fr":["nouveau numero","c'est moi","j'ai change de numero","urgence","mon fils","ma fille","maman","papa","un proche","membre de la famille","hopital","envoie moi de l'argent"],"rw":["nimero nshya","ni njye","nahinduye nimero","ikibazo","umuvandimwe","mama","papa","mubyara","ndi mu kaga","ohereza amafaranga"],"sw":["namba mpya","ni mimi","nimebadilisha namba","dharura","ndugu","mama","baba","nimekwama","hospitalini","nitumie pesa"]},"answer":{"en":"Scammers pretend to be a relative with a new number or an emergency so you pay before thinking. Always confirm it is really them.","fr":"Les escrocs se font passer pour un proche avec un nouveau numéro ou en urgence pour que vous payiez sans réfléchir. Vérifiez toujours que c'est bien lui.","rw":"Abatekamutwe biyita abavandimwe bafite nimero nshya cyangwa ikibazo kugira ngo wishyure utabanje gutekereza. Burigihe emeza ko ari bo koko.","sw":"Matapeli hujifanya ndugu mwenye namba mpya au dharura ili ulipe kabla ya kufikiri. Thibitisha kila mara kuwa ni yeye kweli."},"steps":{"en":["Call the person on their old number, or ask someone else in the family.","Ask a question only the real person could answer.","Do not send money until you have confirmed.","Be careful when you are told to keep it secret."],"fr":["Appelez la personne sur son ancien numéro, ou demandez à un autre membre de la famille.","Posez une question que seule la vraie personne connaît.","N'envoyez pas d'argent avant d'avoir confirmé.","Méfiez-vous si on vous demande de garder le secret."],"rw":["Hamagara uwo muntu kuri nimero ye isanzwe, cyangwa ubaze undi muntu wo mu muryango.","Mubaze ikibazo cyonyine uwo muntu nyawe azi.","Ntugire amafaranga wohereza utarabyemeza.","Ujye witonda iyo bagusabye kubigira ibanga."],"sw":["Mpigie mtu huyo kwa namba yake ya zamani, au muulize mwanafamilia mwingine.","Muulize swali ambalo mtu halisi tu ndiye anajua.","Usitume pesa kabla ya kuthibitisha.","Kuwa makini ukiambiwa uweke siri."]}},{"id":"verify_sender","related":["phishing_basics","pin_otp_rules","check_link"],"title":{"en":"How do I know a message is really from my bank or MTN/Airtel?","fr":"Comment savoir si un message vient vraiment de ma banque ou de MTN/Airtel ?","rw":"Nzi ute ko ubutumwa buva muri banki yanjye cyangwa MTN/Airtel koko?","sw":"Nitajuaje ujumbe unatoka kweli benki yangu au MTN/Airtel?"},"keywords":{"en":["is this message real","really from my bank","really from mtn","really from airtel","really from","verify sender","official message","how to check","genuine","legit","real or fake","is it real"],"fr":["ce message est-il vrai","vraiment de ma banque","vraiment de mtn","vraiment de airtel","verifier l'expediteur","message officiel","comment verifier","authentique","vrai ou faux"],"rw":["ubu butumwa ni ukuri","buva muri banki yanjye","buva kuri mtn","buva kuri airtel","kugenzura uwohereje","ubutumwa bwemewe","ni ukuri cyangwa"],"sw":["ujumbe huu ni wa kweli","unatoka benki yangu","unatoka mtn","unatoka airtel","kuhakiki mtumaji","ujumbe rasmi","halisi au bandia"]},"answer":{"en":"You cannot confirm that from the message alone, because names and numbers can be faked. Contact the organisation yourself.","fr":"On ne peut pas le confirmer à partir du message seul, car les noms et numéros peuvent être falsifiés. Contactez vous-même l'organisme.","rw":"Ntushobora kubyemeza ubutumwa bwonyine, kuko amazina na nimero bishobora kwiganwa. Vugana ubwawe n'ikigo.","sw":"Huwezi kuthibitisha kwa ujumbe pekee, kwa sababu majina na namba vinaweza kughushiwa. Wasiliana na taasisi mwenyewe."},"steps":{"en":["Open the official app, or type the official website address yourself.","Call the number printed on your card, contract or official website.","Visit a branch or service centre if you are unsure.","Never use links or numbers from the message to check it."],"fr":["Ouvrez l'application officielle ou tapez vous-même l'adresse du site officiel.","Appelez le numéro imprimé sur votre carte, votre contrat ou le site officiel.","Rendez-vous en agence si vous avez un doute.","N'utilisez jamais les liens ou numéros du message pour le vérifier."],"rw":["Fungura porogaramu yemewe, cyangwa wandike ubwawe aderesi y'urubuga rwemewe.","Hamagara nimero yanditse ku ikarita yawe, amasezerano cyangwa ku rubuga rwemewe.","Jya ku biro by'ishami niba ufite ikibazo.","Ntukigere ukoresha amahuza cyangwa nimero ziri mu butumwa ngo ubugenzure."],"sw":["Fungua programu rasmi, au andika mwenyewe anwani ya tovuti rasmi.","Piga namba iliyoandikwa kwenye kadi yako, mkataba au tovuti rasmi.","Tembelea tawi ikiwa una shaka.","Usitumie kamwe viungo au namba za ujumbe kuuhakiki."]}},{"id":"strong_passwords","related":["two_step","social_account","pin_otp_rules"],"title":{"en":"How do I make a strong password?","fr":"Comment créer un mot de passe solide ?","rw":"Nakora nte ijambo ry'ibanga rikomeye?","sw":"Ninawezaje kutengeneza nenosiri imara?"},"keywords":{"en":["password","passwords","strong password","passphrase","password manager","reuse password","how long should a password","good password","weak password"],"fr":["mot de passe","mots de passe","mot de passe solide","phrase secrete","gestionnaire de mots de passe","reutiliser","bon mot de passe"],"rw":["ijambo ry'ibanga","amagambo y'ibanga","ijambo ry'ibanga rikomeye","rikomeye","gutekereza ijambo ry'ibanga"],"sw":["nenosiri","manenosiri","nenosiri imara","nenosiri zuri","msimbo wa siri mrefu","kutumia nenosiri"]},"answer":{"en":"A strong password is long and different for every account. Length matters more than clever symbols: four or more unrelated words are easy to remember and hard to guess.","fr":"Un mot de passe solide est long et différent pour chaque compte. La longueur compte plus que les symboles compliqués : quatre mots sans rapport ou plus sont faciles à retenir et difficiles à deviner.","rw":"Ijambo ry'ibanga rikomeye ni rirerire kandi rihabwa buri konti ryihariye. Uburebure bufite akamaro kurusha utwuzuzo: amagambo ane cyangwa arenga adafitanye isano aroroshye kwibuka kandi biragoye kuyakeka.","sw":"Nenosiri imara ni ndefu na tofauti kwa kila akaunti. Urefu ni muhimu kuliko alama za kisasa: maneno manne au zaidi yasiyohusiana ni rahisi kukumbuka na magumu kukisia."},"steps":{"en":["Use a different password for every important account, above all email and mobile money.","Make it at least 12 characters.","Use a password manager, or a notebook kept somewhere safe at home.","Never share it, and never save it in a chat."],"fr":["Utilisez un mot de passe différent pour chaque compte important, surtout la messagerie et le mobile money.","Prévoyez au moins 12 caractères.","Utilisez un gestionnaire de mots de passe, ou un carnet gardé en lieu sûr chez vous.","Ne le partagez jamais et ne l'enregistrez jamais dans une discussion."],"rw":["Koresha ijambo ry'ibanga ritandukanye kuri buri konti y'ingenzi, cyane cyane imeri na mobile money.","Rigire nibura inyuguti 12.","Koresha porogaramu ibika amagambo y'ibanga, cyangwa akaye kabitswe ahantu hizewe mu rugo.","Ntukarisangize abandi kandi ntukarishyire mu butumwa."],"sw":["Tumia nenosiri tofauti kwa kila akaunti muhimu, hasa barua pepe na pesa kwa simu.","Liwe na angalau herufi 12.","Tumia kidhibiti cha manenosiri, au daftari lililohifadhiwa mahali salama nyumbani.","Usilishiriki kamwe wala kulihifadhi kwenye gumzo."]}},{"id":"two_step","related":["strong_passwords","whatsapp_hijack","sim_swap"],"title":{"en":"What is two-step verification?","fr":"Qu'est-ce que la vérification en deux étapes ?","rw":"Kugenzura mu byiciro bibiri ni iki?","sw":"Uthibitisho wa hatua mbili ni nini?"},"keywords":{"en":["two step","two-step","2 step","two factor","two-factor","2fa","mfa","extra security","authenticator","verification step"],"fr":["deux etapes","double authentification","verification en deux etapes","2fa","securite supplementaire","application d'authentification"],"rw":["ibyiciro bibiri","kugenzura mu byiciro bibiri","2fa","umutekano w'inyongera","porogaramu yo kwemeza"],"sw":["hatua mbili","uthibitisho wa hatua mbili","2fa","usalama wa ziada","programu ya uthibitisho"]},"answer":{"en":"Two-step verification asks for a second proof, such as a code from an app or SMS, as well as your password. It stops most account takeovers even if your password is stolen.","fr":"La vérification en deux étapes demande une seconde preuve, comme un code d'une application ou d'un SMS, en plus de votre mot de passe. Elle empêche la plupart des prises de contrôle de compte, même si votre mot de passe est volé.","rw":"Kugenzura mu byiciro bibiri bisaba icyemezo cya kabiri, nka kode iva muri porogaramu cyangwa kuri SMS, hiyongereyeho ijambo ry'ibanga. Bikumira konti nyinshi gufatwa n'abandi, n'iyo ijambo ry'ibanga ryibwe.","sw":"Uthibitisho wa hatua mbili huomba uthibitisho wa pili, kama msimbo kutoka programu au SMS, pamoja na nenosiri lako. Huzuia akaunti nyingi kuchukuliwa hata nenosiri likiibiwa."},"steps":{"en":["Turn it on for email, WhatsApp, social media and banking apps.","Prefer an authenticator app to SMS where you can.","Never read the code to anyone.","Keep any backup codes somewhere safe."],"fr":["Activez-la pour la messagerie, WhatsApp, les réseaux sociaux et les applications bancaires.","Préférez une application d'authentification au SMS quand c'est possible.","Ne lisez jamais le code à personne.","Gardez les codes de secours en lieu sûr."],"rw":["Yishyireho kuri imeri, WhatsApp, imbuga nkoranyambaga na porogaramu za banki.","Hitamo porogaramu yo kwemeza aho kuba SMS igihe bishoboka.","Ntukavuge kode kuri umuntu uwo ari we wese.","Bika kode z'ubwunganizi ahantu hizewe."],"sw":["Iwashe kwa barua pepe, WhatsApp, mitandao ya kijamii na programu za benki.","Pendelea programu ya uthibitisho kuliko SMS inapowezekana.","Usimsomee mtu yeyote msimbo.","Hifadhi misimbo ya akiba mahali salama."]}},{"id":"sim_swap","related":["shared_pin","two_step","lost_phone"],"title":{"en":"What is a SIM swap and how do I notice it?","fr":"Qu'est-ce qu'un échange de SIM et comment le repérer ?","rw":"SIM swap ni iki kandi nayimenya nte?","sw":"SIM swap ni nini na nitaitambuaje?"},"keywords":{"en":["sim swap","sim-swap","swap sim","sim card swap","lost signal suddenly","no network suddenly","someone took my number","number stolen","duplicate sim"],"fr":["echange de sim","sim swap","duplicata de sim","perte soudaine de reseau","mon numero a ete vole","double de ma carte sim"],"rw":["sim swap","guhindura sim","nomero yanjye yibwe","nta murandasi ihise","sim yiganwe","telefoni ntikora gitunguranye"],"sw":["sim swap","kubadilisha sim","namba yangu imeibiwa","mtandao umetoweka ghafla","sim nakala","laini imenakiliwa"]},"answer":{"en":"In a SIM swap a criminal gets a copy of your number so they receive your codes. A sudden loss of signal for no reason, together with unexpected account alerts, is a warning sign.","fr":"Dans un échange de SIM, un criminel obtient un double de votre numéro pour recevoir vos codes. Une perte de réseau soudaine sans raison, avec des alertes de compte inattendues, est un signe d'alerte.","rw":"Muri SIM swap, umugizi wa nabi abona kopi ya nomero yawe kugira ngo yakire kode zawe. Gutakaza network gitunguranye nta mpamvu, hamwe n'ubutumwa bw'konti butunguranye, ni ikimenyetso cy'umuburo.","sw":"Katika SIM swap, mhalifu anapata nakala ya namba yako ili apokee misimbo yako. Kupoteza mtandao ghafla bila sababu, pamoja na arifa za akaunti zisizotarajiwa, ni dalili ya tahadhari."},"steps":{"en":["Contact your provider at once from another phone.","Ask them to secure the number and check for recent SIM changes.","Change passwords for email, banking and WhatsApp.","Ask your provider whether they offer extra protection for your SIM."],"fr":["Contactez immédiatement votre fournisseur depuis un autre téléphone.","Demandez-lui de sécuriser le numéro et de vérifier les changements récents de SIM.","Changez les mots de passe de la messagerie, de la banque et de WhatsApp.","Demandez-lui s'il propose une protection supplémentaire pour votre SIM."],"rw":["Vugana ako kanya n'ikigo cyawe ukoresheje indi telefoni.","Basabe kurinda nomero no kureba impinduka za SIM za vuba.","Hindura amagambo y'ibanga ya imeri, banki na WhatsApp.","Baza ikigo niba gitanga uburinzi bw'inyongera kuri SIM yawe."],"sw":["Wasiliana na mtoa huduma wako mara moja kwa simu nyingine.","Waombe walinde namba na kuangalia mabadiliko ya hivi karibuni ya SIM.","Badilisha nenosiri za barua pepe, benki na WhatsApp.","Muulize mtoa huduma kama ana ulinzi wa ziada kwa SIM yako."]}},{"id":"whatsapp_hijack","related":["two_step","pin_otp_rules","relative_emergency"],"title":{"en":"My WhatsApp was hacked or someone asked for my code","fr":"Mon WhatsApp a été piraté ou on m'a demandé mon code","rw":"WhatsApp yanjye yibwe cyangwa hari uwansabye kode","sw":"WhatsApp yangu imedukuliwa au mtu aliomba msimbo wangu"},"keywords":{"en":["whatsapp hacked","whatsapp hijacked","whatsapp code","6 digit code","six digit code","whatsapp account stolen","friend asks for code","whatsapp verification"],"fr":["whatsapp pirate","whatsapp vole","code whatsapp","code a 6 chiffres","compte whatsapp","ami demande un code"],"rw":["whatsapp yibwe","kode ya whatsapp","kode y'imibare itandatu","konti ya whatsapp","inshuti iransaba kode"],"sw":["whatsapp imedukuliwa","whatsapp imeibiwa","msimbo wa whatsapp","msimbo wa tarakimu sita","akaunti ya whatsapp","rafiki anaomba msimbo"]},"answer":{"en":"A scammer who gets your WhatsApp registration code can take over your account and message your contacts asking for money. Never share the 6-digit code, even with a friend.","fr":"Un escroc qui obtient votre code d'inscription WhatsApp peut prendre le contrôle de votre compte et écrire à vos contacts pour demander de l'argent. Ne partagez jamais le code à 6 chiffres, même avec un ami.","rw":"Umutekamutwe wabonye kode yo kwiyandikisha ya WhatsApp ashobora gufata konti yawe akandikira abo muhuje akabasaba amafaranga. Ntukigere usangiza kode y'imibare 6, ndetse n'inshuti.","sw":"Tapeli anayepata msimbo wako wa usajili wa WhatsApp anaweza kuchukua akaunti yako na kuwaandikia anwani zako akiomba pesa. Usishiriki kamwe msimbo wa tarakimu 6, hata na rafiki."},"steps":{"en":["Turn on two-step verification in the WhatsApp settings.","If hijacked, register your number again to get the account back and warn your contacts.","Ask contacts to ignore money requests sent from your number.","Check linked devices and log out any you do not know."],"fr":["Activez la vérification en deux étapes dans les paramètres de WhatsApp.","Si le compte est détourné, réinscrivez votre numéro pour le récupérer et prévenez vos contacts.","Demandez à vos contacts d'ignorer les demandes d'argent envoyées depuis votre numéro.","Vérifiez les appareils associés et déconnectez ceux que vous ne connaissez pas."],"rw":["Shyira kugenzura mu byiciro bibiri mu igenamiterere rya WhatsApp.","Iyo konti ifashwe, ongera wiyandikishe n'iyo nomero kugira ngo uyigarure, umenyeshe abo muhuje.","Saba abo muhuje kutita ku busabe bw'amafaranga bwoherejwe kuri nomero yawe.","Reba ibikoresho bihuje maze usohore ibyo utazi."],"sw":["Washa uthibitisho wa hatua mbili kwenye mipangilio ya WhatsApp.","Ikidukuliwa, sajili namba yako tena kurudisha akaunti na uwaonye anwani zako.","Waombe anwani zako wapuuze maombi ya pesa yaliyotumwa kutoka namba yako.","Angalia vifaa vilivyounganishwa na utoe usiyovijua."]}},{"id":"check_link","related":["phishing_basics","verify_sender","fake_apps"],"title":{"en":"How do I check if a link is safe?","fr":"Comment vérifier si un lien est sûr ?","rw":"Nsuzuma nte ko ihuza ritekanye?","sw":"Ninawezaje kuangalia kama kiungo ni salama?"},"keywords":{"en":["check a link","is this link safe","link safe","suspicious link","shortened link","bit.ly","click a link","url","website safe","fake website","safe website"],"fr":["verifier un lien","ce lien est-il sur","lien sur","lien suspect","lien raccourci","bit.ly","cliquer sur un lien","url","site sur","faux site"],"rw":["kugenzura ihuza","ihuza ritekanye","ihuza ritazwi","ihuza rigufi","bit.ly","gukanda ihuza","urubuga rwizewe","urubuga rw'ibinyoma"],"sw":["kuangalia kiungo","kiungo ni salama","kiungo cha kutiliwa shaka","kiungo kilichofupishwa","bit.ly","kubofya kiungo","tovuti salama","tovuti bandia"]},"answer":{"en":"Read the web address before you tap. Fake sites copy real ones with small changes, and shortened links hide where they lead. The padlock symbol alone does not prove a site is honest.","fr":"Lisez l'adresse web avant de toucher. Les faux sites copient les vrais avec de petits changements, et les liens raccourcis cachent leur destination. Le cadenas seul ne prouve pas qu'un site est honnête.","rw":"Soma aderesi y'urubuga mbere yo gukanda. Imbuga z'ibinyoma ziganwa izyukuri zihinduweho utuntu duto, kandi amahuza magufi ahisha aho ajya. Akadodo k'umutekano ubwako ntikerekana ko urubuga ari urwizewe.","sw":"Soma anwani ya wavuti kabla ya kugusa. Tovuti bandia hunakili halisi kwa mabadiliko madogo, na viungo vilivyofupishwa huficha vinakoelekea. Alama ya kufuli peke yake haithibitishi tovuti ni ya uaminifu."},"steps":{"en":["Do not tap links in unexpected messages.","Type the official address yourself or use the official app.","Be careful with shortened links and addresses made of numbers.","The real site name is the part just before the first single slash: in example.com/page it is example.com."],"fr":["Ne touchez pas les liens des messages inattendus.","Tapez vous-même l'adresse officielle ou utilisez l'application officielle.","Méfiez-vous des liens raccourcis et des adresses composées de chiffres.","Le vrai nom du site est la partie juste avant la première barre oblique : dans example.com/page, c'est example.com."],"rw":["Ntukande amahuza yo mu butumwa utari witeze.","Andika ubwawe aderesi yemewe cyangwa ukoreshe porogaramu yemewe.","Witondere amahuza magufi na aderesi zigizwe n'imibare.","Izina nyaryo ry'urubuga ni igice kiri imbere y'akarongo ka mbere: muri example.com/page ni example.com."],"sw":["Usiguse viungo vya jumbe zisizotarajiwa.","Andika mwenyewe anwani rasmi au tumia programu rasmi.","Kuwa makini na viungo vilivyofupishwa na anwani za namba.","Jina halisi la tovuti ni sehemu iliyo kabla ya mkwaju wa kwanza: katika example.com/page ni example.com."]}},{"id":"public_wifi","related":["fake_apps","strong_passwords","check_link"],"title":{"en":"Is public Wi-Fi safe?","fr":"Le Wi-Fi public est-il sûr ?","rw":"Wi-Fi rusange irizewe?","sw":"Wi-Fi ya umma ni salama?"},"keywords":{"en":["public wifi","public wi-fi","free wifi","free wi-fi","cafe wifi","hotspot","wifi safe","airport wifi","hotel wifi"],"fr":["wifi public","wi-fi public","wifi gratuit","wi-fi gratuit","wifi du cafe","point d'acces","wifi securise","wifi de l'hotel"],"rw":["wifi rusange","wi-fi rusange","wifi y'ubuntu","wifi ya kafe","wifi yizewe","wifi y'ahantu hahurira abantu"],"sw":["wifi ya umma","wi-fi ya umma","wifi bure","wifi ya mkahawa","wifi salama","wifi ya hoteli"]},"answer":{"en":"Public Wi-Fi can be watched or copied by others. Avoid banking and entering passwords on it.","fr":"Le Wi-Fi public peut être espionné ou imité par d'autres. Évitez d'y faire des opérations bancaires ou de saisir des mots de passe.","rw":"Wi-Fi rusange ishobora gukurikiranwa cyangwa kwiganwa n'abandi. Irinde gukora ibya banki cyangwa kwandika amagambo y'ibanga kuri yo.","sw":"Wi-Fi ya umma inaweza kufuatiliwa au kunakiliwa na wengine. Epuka huduma za benki na kuweka nenosiri juu yake."},"steps":{"en":["Use your mobile data for banking and mobile money.","Ask staff for the exact network name.","Turn off automatic connection to open networks.","Log out and forget the network afterwards."],"fr":["Utilisez vos données mobiles pour la banque et le mobile money.","Demandez au personnel le nom exact du réseau.","Désactivez la connexion automatique aux réseaux ouverts.","Déconnectez-vous et oubliez le réseau ensuite."],"rw":["Koresha murandasi ya telefoni yawe kuri banki na mobile money.","Baza abakozi izina nyaryo rya network.","Zimya guhita wiyunga kuri network zifunguye.","Sohoka maze wibagirwe iyo network nyuma."],"sw":["Tumia data ya simu kwa benki na pesa kwa simu.","Uliza wafanyakazi jina kamili la mtandao.","Zima muunganisho wa kiotomatiki kwa mitandao iliyo wazi.","Ondoka na usahau mtandao baadaye."]}},{"id":"kids_online","related":["id_privacy","fake_apps","social_account"],"title":{"en":"How do I keep children safe online?","fr":"Comment protéger les enfants en ligne ?","rw":"Narinda nte abana kuri murandasi?","sw":"Ninawezaje kuwalinda watoto mtandaoni?"},"keywords":{"en":["children online","kids online","child safety","parental control","parental controls","teenager","screen time","cyberbullying","stranger online","protect my child","my kids","my child"],"fr":["enfants en ligne","securite des enfants","controle parental","adolescent","temps d'ecran","cyberharcelement","inconnu en ligne","proteger mon enfant","mes enfants"],"rw":["abana kuri murandasi","umutekano w'abana","kugenzura abana","ingimbi","igihe cyo kureba ecran","gutotezwa kuri murandasi","kurinda umwana"],"sw":["watoto mtandaoni","usalama wa watoto","udhibiti wa wazazi","kijana","muda wa skrini","uonevu mtandaoni","kumlinda mtoto","watoto wangu"]},"answer":{"en":"Talk early and often about what children see online. Rules work better when they are explained and agreed together.","fr":"Parlez tôt et souvent de ce que les enfants voient en ligne. Les règles marchent mieux quand elles sont expliquées et décidées ensemble.","rw":"Muganire kare kandi kenshi ku byo abana babona kuri murandasi. Amategeko akora neza iyo asobanuwe kandi mukayemeranywaho.","sw":"Zungumza mapema na mara kwa mara kuhusu wanachokiona watoto mtandaoni. Sheria hufanya kazi vizuri zikielezwa na kukubaliwa pamoja."},"steps":{"en":["Keep devices for young children in shared spaces.","Use the privacy and parental settings in apps and on the phone.","Teach them never to share photos, school or address with strangers.","Tell them they will not be punished for telling you about something upsetting."],"fr":["Gardez les appareils des jeunes enfants dans des espaces communs.","Utilisez les réglages de confidentialité et de contrôle parental dans les applications et sur le téléphone.","Apprenez-leur à ne jamais partager photos, école ou adresse avec des inconnus.","Dites-leur qu'ils ne seront pas punis s'ils vous parlent de quelque chose qui les a troublés."],"rw":["Bika ibikoresho by'abana bato ahantu hahurira bose.","Koresha igenamiterere ry'ubuzima bwite n'iryo kugenzura abana muri porogaramu no kuri telefoni.","Wigishe ko batagomba gusangiza abatazi amafoto, ishuri cyangwa aho batuye.","Ubabwire ko batazahanwa nibakubwira ikintu cyabateye ubwoba."],"sw":["Weka vifaa vya watoto wadogo sehemu za pamoja.","Tumia mipangilio ya faragha na ya wazazi kwenye programu na simu.","Wafundishe kamwe wasishiriki picha, shule au anwani na wageni.","Waambie hawataadhibiwa wakikuambia jambo lililowasumbua."]}},{"id":"online_shopping","related":["investment_scams","check_link","fake_prize"],"title":{"en":"How do I avoid fake online shops and sellers?","fr":"Comment éviter les faux sites marchands et vendeurs ?","rw":"Nirinda nte amaduka n'abacuruzi b'ibinyoma kuri murandasi?","sw":"Nawezaje kuepuka maduka na wauzaji bandia mtandaoni?"},"keywords":{"en":["online shopping","marketplace","buy online","seller","facebook marketplace","pay on delivery","too cheap","fake shop","fake store","advance payment","buying a phone online"],"fr":["achats en ligne","marketplace","acheter en ligne","vendeur","paiement a la livraison","trop bon marche","faux site marchand","boutique en ligne","paiement d'avance"],"rw":["kugura kuri murandasi","isoko ryo kuri murandasi","umucuruzi","kwishyura nkimara kwakira","igiciro gito cyane","iduka ry'ibinyoma","kwishyura mbere"],"sw":["kununua mtandaoni","soko la mtandaoni","muuzaji","kulipa ukipokea","bei rahisi mno","duka bandia","malipo ya awali"]},"answer":{"en":"Be careful with deals that look too good, sellers who refuse to meet or want payment first, and shops with no real contact details.","fr":"Méfiez-vous des offres trop belles, des vendeurs qui refusent de vous rencontrer ou veulent être payés d'abord, et des boutiques sans coordonnées réelles.","rw":"Witondere ibiciro bisa n'ibidashoboka, abacuruzi banga guhura nawe cyangwa bashaka ko wishyura mbere, n'amaduka adafite amakuru nyayo yo kuyavugishaho.","sw":"Kuwa makini na ofa zinazoonekana nzuri mno, wauzaji wanaokataa kukutana au wanaotaka malipo kwanza, na maduka yasiyo na mawasiliano halisi."},"steps":{"en":["Prefer paying on delivery, or meeting in a safe public place.","Check the seller's history and reviews, and search the shop name together with the word 'scam'.","Do not pay a shop by sending money to a personal number.","Keep the chat and the payment record."],"fr":["Préférez payer à la livraison ou vous rencontrer dans un lieu public sûr.","Vérifiez l'historique et les avis du vendeur, et cherchez le nom de la boutique avec le mot « arnaque ».","Ne payez pas une boutique en envoyant de l'argent à un numéro personnel.","Conservez la conversation et la preuve de paiement."],"rw":["Hitamo kwishyura wakiriye, cyangwa guhurira ahantu hahurira abantu hizewe.","Reba amateka n'ibitekerezo bya mucuruzi, ushakishe izina ry'iduka hamwe n'ijambo «uburiganya».","Ntukishyure iduka wohereje amafaranga kuri nimero y'umuntu ku giti cye.","Bika ikiganiro n'icyemezo cy'ubwishyu."],"sw":["Pendelea kulipa ukipokea, au kukutana mahali salama pa umma.","Angalia historia na maoni ya muuzaji, na utafute jina la duka pamoja na neno 'utapeli'.","Usilipe duka kwa kutuma pesa kwa namba ya mtu binafsi.","Hifadhi gumzo na ushahidi wa malipo."]}},{"id":"investment_scams","related":["sent_money_scammer","job_visa_scam","online_shopping"],"title":{"en":"Is 'double your money' investment real?","fr":"Un investissement « doublez votre argent » est-il réel ?","rw":"Ishoramari rya «kwikuba kabiri amafaranga» ni ukuri?","sw":"Uwekezaji wa 'mara mbili ya pesa' ni wa kweli?"},"keywords":{"en":["investment","invest","double my money","double your money","guaranteed returns","crypto","forex","pyramid","ponzi","get rich","daily profit","trading group","binary options"],"fr":["investissement","investir","doubler mon argent","doublez votre argent","gains garantis","crypto","forex","pyramide","ponzi","devenir riche","profit quotidien","groupe de trading"],"rw":["ishoramari","gushora","kwikuba kabiri","inyungu yemejwe","crypto","forex","pyramide","ponzi","inyungu za buri munsi","itsinda ryo gucuruza"],"sw":["uwekezaji","kuwekeza","mara mbili ya pesa","faida ya uhakika","crypto","forex","piramidi","ponzi","faida ya kila siku","kundi la biashara"]},"answer":{"en":"No honest investment can guarantee fast profit. 'Double your money' offers, daily-profit promises and pressure to recruit friends are signs of a scam.","fr":"Aucun investissement honnête ne peut garantir un profit rapide. Les offres « doublez votre argent », les promesses de profit quotidien et la pression pour recruter des amis sont des signes d'arnaque.","rw":"Nta shoramari ry'ukuri rishobora kwizeza inyungu yihuse. Amatangazo ya «kwikuba kabiri», amasezerano y'inyungu za buri munsi no gukanda inshuti ngo ziyongere ni ibimenyetso by'uburiganya.","sw":"Hakuna uwekezaji wa uaminifu unaoweza kuhakikisha faida ya haraka. Ofa za 'mara mbili ya pesa', ahadi za faida ya kila siku na shinikizo la kuwaingiza marafiki ni dalili za utapeli."},"steps":{"en":["Do not invest in anything you do not understand.","Check that the company is registered with the proper authority.","Be wary of small early 'profits' designed to make you invest more.","Talk to a trusted adviser before you commit money."],"fr":["N'investissez pas dans ce que vous ne comprenez pas.","Vérifiez que l'entreprise est enregistrée auprès de l'autorité compétente.","Méfiez-vous des petits « profits » du début conçus pour vous faire investir davantage.","Parlez à un conseiller de confiance avant d'engager de l'argent."],"rw":["Ntugashore mu kintu utumva.","Reba ko ikigo cyanditse mu rwego rubifitiye ububasha.","Witondere «inyungu» nto zo mu ntangiriro zagenewe kugushora cyane.","Vugana n'umujyanama wizeye mbere yo gushyiramo amafaranga."],"sw":["Usiwekeze kwenye kitu usichokielewa.","Hakiki kama kampuni imesajiliwa na mamlaka husika.","Kuwa makini na 'faida' ndogo za mwanzo zilizobuniwa kukufanya uwekeze zaidi.","Zungumza na mshauri unayemwamini kabla ya kuweka pesa."]}},{"id":"loan_apps","related":["job_visa_scam","id_privacy","fake_apps"],"title":{"en":"Are instant loan apps safe?","fr":"Les applications de prêt instantané sont-elles sûres ?","rw":"Porogaramu z'inguzanyo zihuse zirizewe?","sw":"Programu za mikopo ya haraka ni salama?"},"keywords":{"en":["loan app","loan apps","instant loan","quick loan","digital loan","micro loan","microloan","loan shark","contact list loan","borrow money app"],"fr":["application de pret","appli de pret","pret instantane","pret rapide","pret numerique","microcredit","usurier","emprunter de l'argent"],"rw":["porogaramu y'inguzanyo","inguzanyo ihuse","inguzanyo ya telefoni","inguzanyo nto","kuguza amafaranga kuri porogaramu"],"sw":["programu ya mkopo","mkopo wa haraka","mkopo wa kidijitali","mikopo midogo","kukopa pesa kwa programu"]},"answer":{"en":"Some loan apps hide fees, demand access to your contacts and photos, or threaten borrowers. Read the terms and check the lender is licensed before you borrow.","fr":"Certaines applications de prêt cachent des frais, exigent l'accès à vos contacts et photos, ou menacent les emprunteurs. Lisez les conditions et vérifiez que le prêteur est agréé avant d'emprunter.","rw":"Porogaramu zimwe z'inguzanyo zihisha amafaranga y'inyongera, zisaba kubona abo muhuje n'amafoto yawe, cyangwa zitera ubwoba abaguze. Soma amabwiriza kandi urebe ko uwaguriza afite uruhushya mbere yo kuguza.","sw":"Baadhi ya programu za mikopo huficha ada, hudai kufikia anwani na picha zako, au hutisha wakopaji. Soma masharti na uhakiki mkopeshaji ana leseni kabla ya kukopa."},"steps":{"en":["Check the lender is licensed with the national regulator.","Read the full cost: fees and interest.","Do not allow access to contacts, photos or messages the loan does not need.","Never pay an 'insurance' or 'release' fee before the loan arrives."],"fr":["Vérifiez que le prêteur est agréé auprès du régulateur national.","Lisez le coût total : frais et intérêts.","N'autorisez pas l'accès aux contacts, photos ou messages dont le prêt n'a pas besoin.","Ne payez jamais de frais d'« assurance » ou de « déblocage » avant l'arrivée du prêt."],"rw":["Reba ko uwaguriza afite uruhushya rutangwa n'urwego rubishinzwe.","Soma igiciro cyose: amafaranga y'inyongera n'inyungu.","Ntiwemere ko babona abo muhuje, amafoto cyangwa ubutumwa inguzanyo idakeneye.","Ntukishyure amafaranga ya «ubwishingizi» cyangwa «gufungura» mbere y'uko inguzanyo ihagera."],"sw":["Hakiki mkopeshaji ana leseni kutoka kwa mdhibiti wa kitaifa.","Soma gharama kamili: ada na riba.","Usiruhusu kufikia anwani, picha au jumbe ambazo mkopo hauhitaji.","Usilipe kamwe ada ya 'bima' au 'kutoa' kabla mkopo haujafika."]}},{"id":"where_to_report","related":["sent_money_scammer","shared_pin","phishing_basics"],"title":{"en":"Where do I report a scam?","fr":"Où signaler une arnaque ?","rw":"Ubwoko bw'uburiganya ntanga he ikirego?","sw":"Naripoti wapi utapeli?"},"keywords":{"en":["report scam","report a scam","where to report","report fraud","who do i call","police","complaint","cyber crime","cybercrime","report to","rib","ncsa","authority"],"fr":["signaler une arnaque","ou signaler","signaler une fraude","qui appeler","police","plainte","cybercriminalite","autorite"],"rw":["gutanga ikirego","aho gutanga ikirego","gutanga amakuru ku buriganya","polisi","ikirego","ibyaha byo kuri murandasi","rib","ncsa","urwego"],"sw":["kuripoti utapeli","wapi kuripoti","kuripoti ulaghai","nimpigie nani","polisi","malalamiko","uhalifu wa mtandao","mamlaka"]},"answer":{"en":"Report to your bank or provider first, then to the police and the national cyber-security authority. Find their contact details yourself on official websites; do not use numbers from a message. In Rwanda this includes the Rwanda Investigation Bureau and the National Cyber Security Authority.","fr":"Signalez d'abord à votre banque ou fournisseur, puis à la police et à l'autorité nationale de cybersécurité. Trouvez vous-même leurs coordonnées sur les sites officiels ; n'utilisez pas les numéros d'un message. Au Rwanda, cela inclut le Rwanda Investigation Bureau et la National Cyber Security Authority.","rw":"Tanga ikirego mbere na banki yawe cyangwa ikigo gitanga serivisi, hanyuma kuri polisi n'urwego rw'igihugu rushinzwe umutekano wa murandasi. Shakira ubwawe amakuru yabo ku mbuga zemewe; ntukoreshe nimero ziri mu butumwa. Mu Rwanda ni Rwanda Investigation Bureau na National Cyber Security Authority.","sw":"Ripoti kwanza kwa benki au mtoa huduma wako, kisha polisi na mamlaka ya kitaifa ya usalama wa mtandao. Tafuta mwenyewe mawasiliano yao kwenye tovuti rasmi; usitumie namba za ujumbe. Rwanda hii inajumuisha Rwanda Investigation Bureau na National Cyber Security Authority."},"steps":{"en":["Tell your provider or bank so they can block accounts.","Report to the police and keep the reference number.","Look up the official site of the national cyber authority for how to report online.","Send the scam message only to official reporting channels, not to friends."],"fr":["Prévenez votre fournisseur ou banque pour qu'ils bloquent les comptes.","Déposez plainte à la police et gardez le numéro de référence.","Consultez le site officiel de l'autorité nationale de cybersécurité pour savoir comment signaler en ligne.","Transmettez le message d'arnaque seulement aux canaux de signalement officiels, pas à vos amis."],"rw":["Menyesha ikigo cyawe cyangwa banki kugira ngo bafunge konti.","Tanga ikirego kuri polisi ubike nomero y'ikirego.","Reba urubuga rwemewe rw'urwego rw'igihugu rushinzwe umutekano wa murandasi urebe uko batanga amakuru kuri murandasi.","Ohereza ubutumwa bw'uburiganya gusa mu nzira zemewe zo gutanga amakuru, ntabwo ari ku nshuti."],"sw":["Mjulishe mtoa huduma au benki ili wazuie akaunti.","Ripoti polisi na uhifadhi namba ya kumbukumbu.","Angalia tovuti rasmi ya mamlaka ya kitaifa ya mtandao kuona jinsi ya kuripoti mtandaoni.","Tuma ujumbe wa utapeli kwa njia rasmi za kuripoti pekee, si kwa marafiki."]}},{"id":"lost_phone","related":["sim_swap","strong_passwords","social_account"],"title":{"en":"My phone was lost or stolen. What should I do?","fr":"Mon téléphone est perdu ou volé. Que faire ?","rw":"Telefoni yanjye yatakaye cyangwa yibwe. Nkore iki?","sw":"Simu yangu imepotea au imeibiwa. Nifanye nini?"},"keywords":{"en":["lost phone","stolen phone","phone stolen","lost my phone","phone lost","block my sim","imei","phone was stolen","my phone is missing"],"fr":["telephone perdu","telephone vole","telephone volee","j'ai perdu mon telephone","bloquer ma sim","imei","mon telephone a disparu"],"rw":["telefoni yatakaye","telefoni yibwe","natakaje telefoni","gufunga sim","imei","telefoni yanjye ntiboneka"],"sw":["simu imepotea","simu imeibiwa","nimepoteza simu","kuzuia sim","imei","simu yangu haipo"]},"answer":{"en":"Act fast: a lost phone can open your accounts. Block the SIM, lock or erase the phone from another device, and change your important passwords.","fr":"Agissez vite : un téléphone perdu peut ouvrir vos comptes. Bloquez la SIM, verrouillez ou effacez le téléphone depuis un autre appareil et changez vos mots de passe importants.","rw":"Ihute: telefoni yatakaye ishobora gufungura konti zawe. Funga SIM, ufunge cyangwa usibe telefoni uri ku kindi gikoresho, uhindure amagambo y'ibanga y'ingenzi.","sw":"Chukua hatua haraka: simu iliyopotea inaweza kufungua akaunti zako. Zuia SIM, funga au futa simu kutoka kifaa kingine, na ubadilishe nenosiri muhimu."},"steps":{"en":["Call your provider from another phone and ask to block the SIM, then get a replacement with the same number.","Change passwords for email, banking, WhatsApp and social media.","Use the phone's find-my-device feature to lock or erase it.","Report theft to the police; keep the IMEI from the phone's box for next time."],"fr":["Appelez votre fournisseur depuis un autre téléphone pour bloquer la SIM, puis faites-vous remplacer la carte avec le même numéro.","Changez les mots de passe de la messagerie, de la banque, de WhatsApp et des réseaux sociaux.","Utilisez la fonction de localisation de l'appareil pour le verrouiller ou l'effacer.","Signalez le vol à la police ; gardez l'IMEI, inscrit sur la boîte du téléphone, pour la prochaine fois."],"rw":["Hamagara ikigo cyawe uri kuri telefoni y'undi, usabe gufunga SIM, hanyuma ubone indi ifite nomero imwe.","Hindura amagambo y'ibanga ya imeri, banki, WhatsApp n'imbuga nkoranyambaga.","Koresha uburyo bwo gushaka telefoni kugira ngo uyifunge cyangwa uyisibe.","Tanga ikirego cy'ubujura kuri polisi; bika IMEI iri ku gasanduku ka telefoni ubutaha."],"sw":["Piga simu kwa mtoa huduma wako kwa simu nyingine uombe SIM izuiwe, kisha upate mbadala yenye namba ile ile.","Badilisha nenosiri za barua pepe, benki, WhatsApp na mitandao ya kijamii.","Tumia kipengele cha kutafuta kifaa kukifunga au kukifuta.","Ripoti wizi polisi; hifadhi IMEI iliyo kwenye boksi la simu kwa baadaye."]}},{"id":"fake_apps","related":["remote_access_apps","loan_apps","check_link"],"title":{"en":"How do I avoid fake or harmful apps?","fr":"Comment éviter les applications fausses ou dangereuses ?","rw":"Nirinda nte porogaramu z'ibinyoma cyangwa zangiza?","sw":"Ninawezaje kuepuka programu bandia au hatari?"},"keywords":{"en":["fake app","fake apps","apk","install app","app store","play store","app permissions","download app","modded","unknown source","malware","virus"],"fr":["fausse application","fausses applications","apk","installer une application","app store","play store","autorisations","telecharger une application","source inconnue","logiciel malveillant","virus"],"rw":["porogaramu y'ibinyoma","apk","gushyiraho porogaramu","play store","uburenganzira bwa porogaramu","gukuramo porogaramu","virusi"],"sw":["programu bandia","apk","kusakinisha programu","play store","ruhusa za programu","kupakua programu","chanzo kisichojulikana","virusi","programu hasidi"]},"answer":{"en":"Install apps only from the official store and check the developer's name. APK files sent in messages or found on unknown sites can contain malware.","fr":"N'installez des applications que depuis la boutique officielle et vérifiez le nom du développeur. Les fichiers APK reçus par message ou trouvés sur des sites inconnus peuvent contenir des logiciels malveillants.","rw":"Shyiraho porogaramu gusa uzikuye mu iduka ryemewe kandi urebe izina ry'uwayikoze. Amadosiye ya APK yoherejwe mu butumwa cyangwa aboneka ku mbuga zitazwi ashobora kuba arimo virusi.","sw":"Sakinisha programu kutoka duka rasmi pekee na uangalie jina la msanidi. Faili za APK zilizotumwa kwenye jumbe au kupatikana kwenye tovuti zisizojulikana zinaweza kuwa na programu hasidi."},"steps":{"en":["Do not install apps sent by link or chat.","Check developer name, reviews and number of downloads.","Refuse permissions an app does not need (SMS, contacts, accessibility).","Delete apps you no longer use."],"fr":["N'installez pas d'applications envoyées par lien ou discussion.","Vérifiez le nom du développeur, les avis et le nombre de téléchargements.","Refusez les autorisations inutiles à l'application (SMS, contacts, accessibilité).","Supprimez les applications que vous n'utilisez plus."],"rw":["Ntushyireho porogaramu woherejwe ku ihuza cyangwa mu kiganiro.","Reba izina ry'uwayikoze, ibitekerezo n'umubare w'abayikuyemo.","Banga uburenganzira porogaramu idakeneye (SMS, abo muhuje, uburyo bwo gufasha).","Siba porogaramu utagikoresha."],"sw":["Usisakinishe programu zilizotumwa kwa kiungo au gumzo.","Angalia jina la msanidi, maoni na idadi ya vipakuliwa.","Kataa ruhusa ambazo programu haihitaji (SMS, anwani, ufikivu).","Futa programu usizotumia tena."]}},{"id":"remote_access_apps","related":["fake_apps","shared_pin","voice_clone_boss"],"title":{"en":"Someone asked me to install AnyDesk or TeamViewer","fr":"On m'a demandé d'installer AnyDesk ou TeamViewer","rw":"Hari uwansabye gushyiraho AnyDesk cyangwa TeamViewer","sw":"Mtu ameniomba nisakinishe AnyDesk au TeamViewer"},"keywords":{"en":["anydesk","teamviewer","remote access","screen share","remote control","support call","tech support scam","quicksupport","install an app for support"],"fr":["anydesk","teamviewer","acces a distance","partage d'ecran","prise en main a distance","appel du support","arnaque au support","quicksupport"],"rw":["anydesk","teamviewer","kugenzura kure","gusangiza ecran","guhamagara ubufasha","uburiganya bw'ubufasha bwa tekiniki","quicksupport"],"sw":["anydesk","teamviewer","ufikiaji wa mbali","kushiriki skrini","udhibiti wa mbali","simu ya msaada","utapeli wa msaada wa kiufundi","quicksupport"]},"answer":{"en":"Remote-control apps let someone see and use your phone, including your banking app. Banks and mobile-money companies do not ask you to install them.","fr":"Les applications de prise en main à distance permettent à quelqu'un de voir et d'utiliser votre téléphone, y compris votre application bancaire. Les banques et opérateurs de mobile money ne vous demandent pas de les installer.","rw":"Porogaramu zo kugenzura kure zituma undi muntu abona kandi agakoresha telefoni yawe, harimo porogaramu ya banki. Banki n'ibigo bya mobile money ntibigusaba kuzishyiraho.","sw":"Programu za udhibiti wa mbali humruhusu mtu kuona na kutumia simu yako, ikiwemo programu ya benki. Benki na kampuni za pesa kwa simu hazikuombi uzisakinishe."},"steps":{"en":["Never install them for a caller.","If you already did: uninstall it, turn on flight mode, and call your bank from another phone.","Change your PIN and passwords.","Report the call."],"fr":["Ne les installez jamais pour un correspondant.","Si vous l'avez déjà fait : désinstallez l'application, activez le mode avion et appelez votre banque depuis un autre téléphone.","Changez votre PIN et vos mots de passe.","Signalez l'appel."],"rw":["Ntuzishyireho kubera uwaguhamagaye.","Niba wazishyizeho: zisibe, ushyire telefoni mu buryo bwa avion, uhamagare banki yawe kuri indi telefoni.","Hindura PIN n'amagambo y'ibanga.","Tanga amakuru kuri ubwo butumwa."],"sw":["Usizisakinishe kamwe kwa mpigaji.","Kama ulishafanya hivyo: iondoe, washa hali ya ndege, na upige simu benki yako kwa simu nyingine.","Badilisha PIN na nenosiri.","Ripoti simu hiyo."]}},{"id":"id_privacy","related":["kids_online","loan_apps","sim_swap"],"title":{"en":"How do I protect my ID and personal data?","fr":"Comment protéger ma pièce d'identité et mes données personnelles ?","rw":"Nkingira nte indangamuntu n'amakuru yanjye bwite?","sw":"Ninawezaje kulinda kitambulisho na taarifa zangu binafsi?"},"keywords":{"en":["id photo","national id","identity card","selfie with id","send my id","passport","personal data","privacy","nida","data protection","id number"],"fr":["photo de carte d'identite","carte d'identite","selfie avec carte","envoyer ma carte","passeport","donnees personnelles","vie privee","protection des donnees","numero d'identite"],"rw":["ifoto y'indangamuntu","indangamuntu","selfie n'indangamuntu","kohereza indangamuntu","pasiporo","amakuru bwite","ubuzima bwite","kurinda amakuru","nomero y'indangamuntu"],"sw":["picha ya kitambulisho","kitambulisho","selfie na kitambulisho","kutuma kitambulisho","pasipoti","taarifa binafsi","faragha","ulinzi wa data","namba ya kitambulisho"]},"answer":{"en":"Your ID number and photo can be used to open accounts or SIM cards in your name. Share them only when you started the request and trust the organisation.","fr":"Votre numéro et photo d'identité peuvent servir à ouvrir des comptes ou des cartes SIM à votre nom. Ne les partagez que si vous avez lancé la demande et faites confiance à l'organisme.","rw":"Nomero y'indangamuntu yawe n'ifoto bishobora gukoreshwa mu gufungura konti cyangwa SIM mu izina ryawe. Bisangize gusa iyo ari wowe watangiye icyo gusaba kandi wizeye ikigo.","sw":"Namba na picha ya kitambulisho chako vinaweza kutumika kufungua akaunti au SIM kwa jina lako. Vishiriki tu pale ulipoanzisha ombi na unaiamini taasisi."},"steps":{"en":["Ask why they need it and how it will be kept.","On copies you must hand over, write 'for X only' and the date across them.","Do not send ID photos by chat to people you met online.","If you think it leaked, check your accounts and SIM registrations."],"fr":["Demandez pourquoi ils en ont besoin et comment elle sera conservée.","Sur les copies à remettre, écrivez « uniquement pour X » et la date en travers.","N'envoyez pas de photos de pièce d'identité par discussion à des personnes rencontrées en ligne.","Si vous pensez qu'elle a fuité, vérifiez vos comptes et vos enregistrements de SIM."],"rw":["Baza impamvu bayikeneye n'uko izabikwa.","Ku makopi ugomba gutanga, andika «ku bwa X gusa» n'itariki hejuru yayo.","Ntukohereze amafoto y'indangamuntu mu kiganiro ku bantu mwahuriye kuri murandasi.","Niba ukeka ko yasohotse, reba konti zawe n'imyandikishirize ya SIM."],"sw":["Uliza kwa nini wanahitaji na itahifadhiwaje.","Kwenye nakala unazopaswa kutoa, andika 'kwa X pekee' na tarehe juu yake.","Usitume picha za kitambulisho kwa gumzo kwa watu uliokutana nao mtandaoni.","Ukidhani imevuja, angalia akaunti zako na usajili wa SIM."]}},{"id":"voice_clone_boss","related":["relative_emergency","remote_access_apps","investment_scams"],"title":{"en":"My boss or an official asks for urgent payment or gift cards","fr":"Mon patron ou un responsable demande un paiement urgent ou des cartes cadeaux","rw":"Umukoresha wanjye cyangwa umuyobozi ansaba kwishyura byihuse cyangwa amakarita y'impano","sw":"Bosi wangu au afisa ananiomba malipo ya haraka au kadi za zawadi"},"keywords":{"en":["boss","ceo","director asks","manager asks","gift card","gift cards","voucher","urgent payment","deepfake","voice clone","fake voice","fake video","official asks","google play card"],"fr":["patron","directeur demande","responsable demande","carte cadeau","cartes cadeaux","bon d'achat","paiement urgent","deepfake","voix clonee","fausse voix","fausse video","google play"],"rw":["umukoresha wanjye","umuyobozi arasaba","amakarita y'impano","ama-vocha","kwishyura byihuse","deepfake","ijwi ryiganwe","videwo y'ibinyoma"],"sw":["bosi","mkurugenzi anaomba","meneja anaomba","kadi za zawadi","vocha","malipo ya haraka","deepfake","sauti bandia","video bandia","afisa anaomba"]},"answer":{"en":"Scammers can copy a boss's name and photo, and even imitate a voice or video. Urgent requests for payment, gift cards or secrecy should be confirmed another way.","fr":"Les escrocs peuvent copier le nom et la photo d'un patron, voire imiter une voix ou une vidéo. Les demandes urgentes de paiement, de cartes cadeaux ou de secret doivent être confirmées autrement.","rw":"Abatekamutwe bashobora kwigana izina n'ifoto by'umukoresha, ndetse n'ijwi cyangwa videwo. Ubusabe bwihutirwa bwo kwishyura, amakarita y'impano cyangwa ibanga bugomba kwemezwa muundi buryo.","sw":"Matapeli wanaweza kunakili jina na picha ya bosi, hata kuiga sauti au video. Maombi ya haraka ya malipo, kadi za zawadi au siri yanapaswa kuthibitishwa kwa njia nyingine."},"steps":{"en":["Confirm face to face, or on a number you already know.","Follow your organisation's payment procedure.","Be careful with unusual requests even if the voice sounds right.","Tell your manager or IT team."],"fr":["Confirmez en personne ou sur un numéro que vous connaissez déjà.","Suivez la procédure de paiement de votre organisation.","Méfiez-vous des demandes inhabituelles même si la voix semble juste.","Prévenez votre responsable ou l'équipe informatique."],"rw":["Emeza imbonankubone cyangwa kuri nimero usanzwe uzi.","Kurikiza uburyo ikigo cyawe cyishyuramo.","Witondere ubusabe budasanzwe n'iyo ijwi risa nk'iryukuri.","Menyesha umuyobozi wawe cyangwa ikipe ya IT."],"sw":["Thibitisha ana kwa ana au kwa namba unayoijua tayari.","Fuata utaratibu wa malipo wa taasisi yako.","Kuwa makini na maombi yasiyo ya kawaida hata sauti ikisikika sahihi.","Mwambie meneja wako au timu ya TEHAMA."]}},{"id":"social_account","related":["strong_passwords","two_step","whatsapp_hijack"],"title":{"en":"How do I protect my social media accounts?","fr":"Comment protéger mes comptes de réseaux sociaux ?","rw":"Nkingira nte konti zanjye z'imbuga nkoranyambaga?","sw":"Ninawezaje kulinda akaunti zangu za mitandao ya kijamii?"},"keywords":{"en":["social media","facebook","instagram","tiktok","twitter","account hacked","hacked account","fake profile (function (root) {
