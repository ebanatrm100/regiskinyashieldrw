# GPU server (NVIDIA + Docker + nvidia-container-toolkit). Starts an OpenAI-compatible endpoint on port 8000.
#   cp deploy/env.example .env   (edit it)   then   docker compose -f deploy/docker-compose.vllm.yml up -d
# Put HTTPS in front (Caddy/nginx/Cloudflare Tunnel) before using it from Streamlit Cloud. Never expose it without MODEL_API_KEY.
services:
  llm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes: ["hf-cache:/root/.cache/huggingface"]
    command: ["--model", "${MODEL_ID}", "--api-key", "${MODEL_API_KEY}", "--max-model-len", "4096"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
volumes:
  hf-cache:
