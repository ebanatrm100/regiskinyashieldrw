<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 72" width="48" height="54" role="img" aria-label="KinyaShield"><defs><linearGradient id="ksg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b6e4f"/><stop offset="1" stop-color="#1a8fc4"/></linearGradient></defs><path d="M32 3 L58 12 V35 C58 52 46 63 32 69 C18 63 6 52 6 35 V12 Z" fill="url(#ksg)"/><path d="M32 9 L52 16 V35 C52 48 43 57 32 62 C21 57 12 48 12 35 V16 Z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><path d="M24 22 V50 M24 36 L40 22 M28.5 32.5 L41 50" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <div><h1>KinyaShield RW</h1><p id="tagline"></p></div>
    </div>
    <div class="tools">
      <div class="seg" id="langseg" role="group" aria-label="Language"></div>
      <button class="chip" id="sizeBtn" type="button"></button>
      <button class="chip" id="themeBtn" type="button"></button>
    </div>
  </header>

  <div class="note" id="draftNote" hidden></div>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" id="tab-check" aria-controls="p-check" aria-selected="true" type="button"></button>
    <button role="tab" id="tab-learn" aria-controls="p-learn" aria-selected="false" type="button"></button>
    <button role="tab" id="tab-about" aria-controls="p-about" aria-selected="false" type="button"></button>
  </div>

  <section class="panel" id="p-check" role="tabpanel" aria-labelledby="tab-check">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label class="lbl" for="msg" id="pasteLbl"></label>
        <textarea id="msg" autocomplete="off" spellcheck="false"></textarea>
        <div class="row" style="margin-top:6px"><span class="tag" id="exTag" hidden></span><span class="small" id="privacy"></span></div>
      </div>
      <div class="row">
        <button class="btn primary" id="go" type="button"></button>
        <button class="btn ghost" id="clear" type="button"></button>
        <select id="examples" aria-label="Examples"></select>
      </div>
      <div id="result" aria-live="polite"></div>
    </div>
  </section>

  <section class="panel" id="p-learn" role="tabpanel" aria-labelledby="tab-learn" hidden></section>
  <section class="panel" id="p-about" role="tabpanel" aria-labelledby="tab-about" hidden></section>
</div>
