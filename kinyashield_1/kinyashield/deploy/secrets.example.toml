# Paste into Streamlit Cloud -> Settings -> Secrets (never commit real values)
LLM_PROVIDER = "openai"
LLM_BASE_URL = "https://llm.example.org/v1"
LLM_MODEL = "your-org/your-model"
LLM_API_KEY = "same as MODEL_API_KEY"
# LLM_ENGLISH_ONLY = "1"
# TRANSLATOR = "hf"
# TRANSLATOR_URL = "https://translate.example.org"
# AI_MESSAGES_PER_SESSION = "30"

# --- Backup AI services (optional, all have free tiers). The app tries Gemini first, then these in order.
# GEMINI_API_KEY_2 = "..."        # a second Gemini key from another Google account shares the free quota
# GROQ_API_KEY = "..."            # https://console.groq.com  (model llama-3.3-70b-versatile)
# OPENROUTER_API_KEY = "..."      # https://openrouter.ai    (free models)
# MISTRAL_API_KEY = "..."
# TOGETHER_API_KEY = "..."

# --- Image creation (Image Studio tab and "draw ..." requests in the chat). Any ONE of these is enough; they are tried in this order.
# (Gemini keys above also work: model IMAGE_MODEL_GEMINI, default "gemini-2.5-flash-image")
# HF_TOKEN = "hf_..."                          # Hugging Face (free tier), model HF_IMAGE_MODEL = "black-forest-labs/FLUX.1-schnell"
# IMAGE_BASE_URL = "https://your-server/v1"    # any OpenAI-compatible /images/generations server
# IMAGE_MODEL = "your-image-model"
# IMAGE_API_KEY = "..."
# IMAGE_ALLOW_PUBLIC = "false"                 # the free keyless public service (Pollinations) is ON by default as a last resort; set "false" to turn it off. Only the prompt text is sent to a third party

# --- Many users at once (Image Studio). Every key/token below becomes its own "lane": a lane that runs out of quota is skipped for a while and the
# --- others keep working, and load is spread evenly. More lanes = more pictures per minute. Nothing here can create capacity by itself.
# GEMINI_API_KEY_3 = "..."  (up to GEMINI_API_KEY_8)       HF_TOKEN_2 = "hf_..." (up to HF_TOKEN_4)       IMAGE_BASE_URL_2 / IMAGE_MODEL_2 (up to _4)
# IMAGE_MAX_CONCURRENT = "6"       # pictures being made at the same moment on this server; the rest wait in a line (default 6)
# IMAGE_QUEUE_WAIT = "45"          # seconds a person may wait in line before seeing "try again" (default 45)
# IMAGE_PER_MINUTE = "6"           # per visitor (default 6)        IMAGE_PER_HOUR = "40"   (default 40)       0 = no limit
# IMAGE_GLOBAL_PER_MINUTE = "0"    # optional cap for the whole app per minute (0 = off); protects your quota from many new tabs
# IMAGE_CACHE_MB = "120"           # memory for the shared cache: the same request is answered instantly and costs no quota

# --- Real photos from the internet (Image Studio > "Find real photos online" and "photos of ..." in the chat).
# Wikimedia Commons and Openverse need no key. These free keys add more sources (each is optional):
# PIXABAY_API_KEY = "..."          # https://pixabay.com/api/docs/
# PEXELS_API_KEY = "..."           # https://www.pexels.com/api/
# UNSPLASH_ACCESS_KEY = "..."      # https://unsplash.com/developers
# OPENVERSE_CLIENT_ID = "..."      # optional, higher Openverse limits   OPENVERSE_CLIENT_SECRET = "..."

